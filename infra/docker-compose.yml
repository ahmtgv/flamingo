# Flamingo — local dev stack.
#
# Brings up the data stores and both apps. In production these run on Yandex
# Cloud pinned to the RF region (152-FZ data residency); locally we use the
# open-source equivalents: PostgreSQL, Redis, and MinIO (S3-compatible).
#
# LiveKit (self-hosted video) is intentionally omitted here — it lands with the
# scheduling/lessons module. The API only ever issues room tokens.

name: flamingo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flamingo}
      POSTGRES_USER: ${POSTGRES_USER:-flamingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flamingo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flamingo} -d ${POSTGRES_DB:-flamingo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. DB stores object keys only; bytes go here via
  # presigned URLs (files module). Console at http://localhost:9001.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-flamingo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-flamingo-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TURN relay (Р5.1). Media goes peer-to-peer from the teacher's machine; coturn carries it
  # only for the 20-40% of real networks that refuse a direct path — school Wi-Fi, mobile
  # operators, corporate internet (R5_DESKTOP_HOST_BUDGET.md §1). Without it those pupils do
  # not connect at all.
  #
  # `use-auth-secret` means no accounts on the relay: the API mints a username that is an
  # expiry timestamp and a password that is its HMAC (common/turn.py), so a credential dies
  # within the hour and there is no second place a person's identity is written down.
  #
  # `--no-tls`/`--no-dtls` are DEV ONLY. A production relay terminates TLS and sets
  # `--realm` and `--external-ip` to its own public address.
  coturn:
    image: coturn/coturn:4.6
    network_mode: host          # a relay needs real ports; NAT in front of it defeats it
    command: >
      turnserver
      --listening-port=${TURN_PORT:-3478}
      --realm=${TURN_REALM:-flamingo.local}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-dev-turn-secret}
      --min-port=${TURN_MIN_PORT:-49160}
      --max-port=${TURN_MAX_PORT:-49200}
      --no-tls
      --no-dtls
      --no-multicast-peers
      --no-cli
      --log-file=stdout

  backend:
    build: ../backend
    command: sh -c "python manage.py migrate && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-flamingo}
      POSTGRES_USER: ${POSTGRES_USER:-flamingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flamingo}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CHANNELS_REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-flamingo}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-flamingo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-flamingo-secret}
      # The API mints relay credentials; it never sees a packet.
      TURN_URLS: ${TURN_URLS:-turn:host.docker.internal:3478}
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # Browser stays same-origin (/graphql/); Vite proxies it to the API
      # container over the compose network (see frontend/vite.config.ts).
      VITE_GRAPHQL_HTTP_URL: /graphql/
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
