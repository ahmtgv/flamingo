# Flamingo — точка встречи. Продакшн, минимальный VPS в РФ.
#
# Что здесь крутится и почему именно это:
#
#   postgres  — расписание, учётки, зеркало ученика. Персональные данные детей,
#               поэтому машина обязана стоять в РФ (152-ФЗ, CLAUDE.md §2.3).
#   redis     — слой каналов для подписок (presence, сигналинг). Не Celery: async отложен.
#   api       — Django/ASGI: GraphQL + WebSocket. Точка встречи и сигналинг.
#   caddy     — TLS сам, без certbot и без ручного продления.
#
#   coturn    — ретрансляция. Вернулась на свой сервер: трафик у VPS безлимитный, значит
#               ретранслятор стоит ноль, не нужен иностранный посредник в цепочке детского
#               видео и не нужен новый код — coturn написан и проверен в Р5.1.
#               Худший случай 148 ГБ/мес, пик 4 Мбит/с на канале 100 — три процента.
#
#   minio     — объектное хранилище файлов. Возвращено 15.08: я убрал его, решив, что файлы
#               живут на машине преподавателя. Это верно для десктопа, но НЕ для сайта:
#               материалы курса, вложения домашних работ и файлы зеркала ученика грузятся
#               presigned-ссылками в S3. Без него загрузка падает — поймано владельцем
#               на первом же курсе.
#
# Чего здесь НЕТ и не будет:
#   livekit   — медиа идёт с машины преподавателя, серверу здесь делать нечего.
#
# Запуск:  docker compose -f infra/prod/docker-compose.prod.yml --env-file .env.production up -d

name: flamingo-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ежедневный дамп кладём сюда же; забирать наружу — задача владельца.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем: база доступна только внутри сети compose.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no   # только канальный слой, хранить нечего
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../../.env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Миграции при старте: пилот, отдельного шага выката пока не нужно.
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --proxy-headers"
    volumes:
      - media_data:/app/media
    expose:
      - "8000"

  # Ретранслятор. Нужен тем 20-40% сетей, которые не пропускают прямое соединение:
  # школьный Wi-Fi, мобильные операторы, корпоративный интернет. Без него часть учеников
  # просто не подключится.
  #
  # network_mode: host — не прихоть: ретранслятору нужны настоящие порты, NAT перед ним
  # обесценивает саму его работу. Аккаунтов нет: API выдаёт короткоживущий кредентив
  # (имя = срок годности, пароль = его HMAC), см. backend/common/turn.py.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: >
      turnserver
      --listening-port=3478
      --realm=${TURN_REALM}
      --external-ip=${TURN_EXTERNAL_IP}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --min-port=49160
      --max-port=49200
      --no-multicast-peers
      --no-cli
      --log-file=stdout

  # Объектное хранилище. Браузер грузит файлы НАПРЯМУЮ по подписанной ссылке, минуя API —
  # поэтому хранилищу нужен публичный адрес (files.flamingo.plus), а не только внутренний.
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Подпись presigned-ссылки включает адрес, поэтому MinIO обязан знать свой внешний.
      MINIO_SERVER_URL: https://${FILES_DOMAIN}
      MINIO_BROWSER_REDIRECT_URL: https://${FILES_DOMAIN}/console
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Одноразовое создание корзины. Без неё первая же загрузка упрётся в «нет такой корзины».
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set fl http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
             mc mb --ignore-existing fl/${S3_BUCKET} &&
             echo 'bucket ready'"
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddyfile обращается к {$API_DOMAIN} — это подстановка САМОГО Caddy, а не compose.
    # Значит переменная обязана быть внутри контейнера: без неё имя сайта пустое,
    # конфигурация невалидна и контейнер падает с кодом 1. Поймано на первом запуске 15.08.
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  media_data:
  caddy_data:
  caddy_config:
