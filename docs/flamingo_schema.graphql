# =============================================================================
# Flamingo — GraphQL Schema (SDL)
# Version: 1.0  ·  Date: 2026-06-13
# Status: foundation for the API layer (Graphene/Strawberry) over the ERD.
#
# Conventions
# - `ID` values are UUIDs (see ERD §1). `DateTime` is ISO-8601 (timestamptz).
# - Auth: JWT in the Authorization header. `me` and role queries require auth;
#   `verifyCertificate` is PUBLIC (no auth) for the /verify/{id} page.
# - File uploads: client calls `requestUpload` -> gets a presigned S3 URL +
#   `fileKey`, uploads bytes directly to object storage, then passes `fileKey`
#   to the relevant mutation. No multipart through GraphQL. (ERD §1 "files by key")
# - SEduM/CMF: raw video never reaches the server. Clients push only aggregates
#   via `reportAttention`; teachers watch a class live via `attentionUpdates`.
# - Pagination: lightweight cursor connections (`*Connection` + `PageInfo`).
# =============================================================================

scalar DateTime
scalar Date        # calendar day (no time) — start-page week strip
scalar JSON

# ----------------------------------------------------------------------------- Enums
enum Role { STUDENT PARENT TEACHER ADMIN }
enum AgeBand { JUNIOR TEEN ADULT }
enum LearningProfileKind { PUPIL CADET TEACHER }
enum StartEntryKind { LESSON_SESSION HOMEWORK_DUE HOMEWORK_GRADED GRADING_QUEUE CONTINUE_LESSON }
enum LessonProgress { DONE CURRENT AHEAD }
# A telescope lesson stays a lesson in the programme; doing it opens the instrument's page.
enum LessonKind { STANDARD EXTERNAL_DEVICE }
enum SavedItemKind { SAVED WATCH_LATER }
# Where a piece of work stands for a learner (atlas 01, «Задания»).
enum TaskState { TODO SUBMITTED GRADED OVERDUE }
# Chat (R2). The kind decides who may be a member; it is never a display label.
enum ChannelKind { SUBJECT_GROUP PUPIL_TEACHER PEER STAFF_ROOM }
enum ReportStatus { OPEN REVIEWED DISMISSED }
# Board (R3.2). A mind-map is these plus LINK, not a separate mode.
enum BoardElementKind { PEN TEXT STICKER SHAPE LINK IMAGE }
enum VerificationStatus { PENDING APPROVED REJECTED }
enum InstitutionStatus { PENDING ACTIVE INACTIVE }
enum MembershipRole { TEACHER STUDENT ADMIN }
enum MembershipStatus { PENDING ACTIVE INACTIVE }
enum GuardianshipStatus { PENDING ACTIVE }
enum CourseLevel {
  GRADE_1 GRADE_2 GRADE_3 GRADE_4 GRADE_5 GRADE_6
  GRADE_7 GRADE_8 GRADE_9 GRADE_10 GRADE_11 ADULT
}
enum CourseStatus { DRAFT PUBLISHED ARCHIVED }
enum LessonStatus { DRAFT PUBLISHED }
enum SessionStatus { SCHEDULED LIVE ENDED CANCELED }
enum MaterialType { FILE LINK TEXT }
# How a course's marks are entered and shown (owner decision 2026-08-13). Display only:
# Submission.score stays one number and topic mastery is computed in internal fractions, so a
# five-point course is not analysed more coarsely than a percent one.
enum GradingScale { FIVE_POINT PERCENT }
# Exercises (R4.1 — RND_01_SPEC_ENGLISH §3/§7.2). Subject-neutral: the same kinds serve
# Russian and astronomy, which is why the app is `exercises`, not `english`.
enum ExerciseKind {
  VOCAB_CARD CLOZE CHOICE WORD_ORDER MATCH LISTENING
  DICTATION PRONUNCIATION SPEAKING WRITING TRANSFORM ROLEPLAY
}
enum SkillArea { VOCAB GRAMMAR LISTENING READING WRITING SPEAKING PRONUNCIATION }
# Where a set is used — and with it whether the journal ever hears about it (§7.4).
enum ExerciseMode { LIVE HOMEWORK PRACTICE }
enum AttemptContext { LIVE HOMEWORK PRACTICE }
enum EnrollmentStatus { ACTIVE COMPLETED PENDING }
enum HomeworkType { FILE TEXT QUIZ }
enum SubmissionStatus { SUBMITTED LATE GRADED }
enum AttendanceStatus { PRESENT ABSENT LATE }
enum RecommendationKind { SCHEDULE COURSE MATERIAL WELLBEING }
enum InsightKind { GOOD WATCH }
enum PointReason { ATTENDANCE HOMEWORK GRADE STREAK }
enum ReviewStatus { VISIBLE PENDING HIDDEN }
enum NotificationType { GRADE NEW_LESSON ABSENCE HOMEWORK_DONE CMF_INSIGHT WEEKLY_DIGEST }
enum NotificationChannel { PUSH EMAIL IN_APP }
enum UploadPurpose { AVATAR MATERIAL SUBMISSION VERIFICATION COVER INSTITUTION_LOGO }

# ----------------------------------------------------------------------------- Identity & org
type User {
  id: ID!
  email: String!
  phone: String
  role: Role!
  firstName: String!
  lastName: String!
  locale: String!
  isActive: Boolean!
  avatarUrl: String
  createdAt: DateTime!
  studentProfile: StudentProfile
  teacherProfile: TeacherProfile
  parentProfile: ParentProfile
  adminProfile: AdminProfile
}

type StudentProfile {
  user: User!
  birthDate: DateTime
  ageBand: AgeBand!
  gradeLevel: String
  points: Int!
  institution: Institution
}

type TeacherProfile {
  user: User!
  specialty: String
  education: String
  experience: String
  bio: String
  verificationStatus: VerificationStatus!
  rating: Float
  reviewCount: Int!
}

type ParentProfile {
  user: User!
