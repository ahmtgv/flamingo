}

# Public verification result (no auth) for /verify/{verificationId}
type CertificateVerification {
  valid: Boolean!
  studentName: String
  courseTitle: String
  institutionName: String
  issuedAt: DateTime
}

# ----------------------------------------------------------------------------- SEduM (CMF) — aggregates only
type AttentionMetric {
  id: ID!
  sessionId: ID!
  studentId: ID!
  bucketStart: DateTime!
  avgAttention: Int!           # 0..100 (engagement composite; persisted)
  # Per-bucket aggregate sub-metrics — LIVE-ONLY (broadcast for the realtime teacher view,
  # NOT persisted; the DB stores only avgAttention). Aggregate scalars, never raw/frames.
  gazeOnScreen: Int            # 0..100 (% on-screen)
  eyeOpenness: Int             # 0..100
  headYaw: Int                 # degrees (signed)
  headPitch: Int               # degrees (signed)
  alertness: Int               # 0..100 (alert vs drowsy)
}

type AttentionPoint { at: DateTime! value: Int! }

type AttentionSummary {
  averageAttention: Int!
  peak: Int!
  low: Int!
  points: [AttentionPoint!]!
}

type SubjectAttention { subject: String! averageAttention: Int! }
type DailyAttention { weekday: Int! averageAttention: Int! }   # 1=Mon..7=Sun
type Insight { kind: InsightKind! text: String! }

type AttentionAnalytics {
  averageAttention: Int!
  bySubject: [SubjectAttention!]!
  byWeekday: [DailyAttention!]!
  insights: [Insight!]!
}

type GroupAnalytics {
  group: Group!
  averageAttention: Int!
  averageGrade: Float
  attendancePct: Int!
  students: [StudentStat!]!
  attentionBySession: [AttentionPoint!]!
  insights: [Insight!]!
}

type StudentStat {
  student: StudentProfile!
  averageAttention: Int
  averageGrade: Float
  attendancePct: Int!
}

type Recommendation {
  id: ID!
  kind: RecommendationKind!
  title: String!
