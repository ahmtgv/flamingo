# =============================================================================
# Flamingo — GraphQL Schema (SDL)
# Version: 1.0  ·  Date: 2026-06-13
# Status: foundation for the API layer (Graphene/Strawberry) over the ERD.
#
# Conventions
# - `ID` values are UUIDs (see ERD §1). `DateTime` is ISO-8601 (timestamptz).
# - Auth: JWT in the Authorization header. `me` and role queries require auth;
#   `verifyCertificate` is PUBLIC (no auth) for the /verify/{id} page.
# - File uploads: client calls `requestUpload` -> gets a presigned S3 URL +
#   `fileKey`, uploads bytes directly to object storage, then passes `fileKey`
#   to the relevant mutation. No multipart through GraphQL. (ERD §1 "files by key")
# - SEduM/CMF: raw video never reaches the server. Clients push only aggregates
#   via `reportAttention`; teachers watch a class live via `attentionUpdates`.
# - Pagination: lightweight cursor connections (`*Connection` + `PageInfo`).
# =============================================================================

scalar DateTime
scalar Date        # calendar day (no time) — start-page week strip
scalar JSON

# ----------------------------------------------------------------------------- Enums
enum Role { STUDENT PARENT TEACHER ADMIN }
enum AgeBand { JUNIOR TEEN ADULT }
enum LearningProfileKind { PUPIL CADET TEACHER }
# 🔴 §27.5 п.1: у «Требует внимания» лист 00 обещает ТРИ вида записей, был один.
enum StartEntryKind {
  LESSON_SESSION HOMEWORK_DUE HOMEWORK_GRADED GRADING_QUEUE CONTINUE_LESSON
  CHAT_QUESTIONS      # преподаватель: непрочитанное от своих людей
  MATERIALS_MISSING   # преподаватель: занятие сегодня, к которому ничего не приложено
  REPETITION_DUE      # ученик: карточки, которые интервальное повторение считает созревшими
}
enum LessonProgress { DONE CURRENT AHEAD }
# A telescope lesson stays a lesson in the programme; doing it opens the instrument's page.
enum LessonKind { STANDARD EXTERNAL_DEVICE }
enum SavedItemKind { SAVED WATCH_LATER }
# Where a piece of work stands for a learner (atlas 01, «Задания»).
enum TaskState { TODO SUBMITTED GRADED OVERDUE }
# Chat (R2). The kind decides who may be a member; it is never a display label.
enum ChannelKind { SUBJECT_GROUP PUPIL_TEACHER PEER STAFF_ROOM }
enum ReportStatus { OPEN REVIEWED DISMISSED }
# Board (R3.2). A mind-map is these plus LINK, not a separate mode.
enum BoardElementKind { PEN TEXT STICKER SHAPE LINK IMAGE }
enum VerificationStatus { PENDING APPROVED REJECTED }
enum InstitutionStatus { PENDING ACTIVE INACTIVE }
enum MembershipRole { TEACHER STUDENT ADMIN }
enum MembershipStatus { PENDING ACTIVE INACTIVE }
enum GuardianshipStatus { PENDING ACTIVE }
# Аудитория курса — ДВЕ независимые оси (решение владельца 2026-08-15).
# CourseLevel отвечает «кому» — место человека в системе образования; CourseFormat — «что это
# за программа». Одним списком они не выражаются: «курс английского для 7 класса» требует
# обеих осей сразу, и в едином списке пришлось бы заводить пункт на каждую пару.
# Деление совпадает с ФЗ-273: ст. 10 перечисляет уровни, ст. 75–76 ставит дополнительное и
# дополнительное профессиональное отдельной ветвью.
enum CourseLevel {
  PRESCHOOL
  GRADE_1 GRADE_2 GRADE_3 GRADE_4 GRADE_5 GRADE_6
  GRADE_7 GRADE_8 GRADE_9 GRADE_10 GRADE_11
  COLLEGE UNIVERSITY ADULT
}
enum CourseFormat { PROGRAM COURSE PROFESSIONAL }
enum CourseStatus { DRAFT PUBLISHED ARCHIVED }
enum LessonStatus { DRAFT PUBLISHED }
enum SessionStatus { SCHEDULED LIVE ENDED CANCELED }
enum MaterialType { FILE LINK TEXT }
# How a course's marks are entered and shown (owner decision 2026-08-13). Display only:
# Submission.score stays one number and topic mastery is computed in internal fractions, so a
# five-point course is not analysed more coarsely than a percent one.
# PASS_FAIL — решение владельца §28.2 (зачёт/незачёт, БЕЗ числа).
# MARKLESS — дошкольники и первый класс: ФГОС НОО (приказ 373 от 06.10.2009, ред. 286 от
# 31.05.2021) и ФЗ-273. Не «шкала без цифр»: значки и баллы вместо цифр запрещены тоже,
# разрешена только словесная оценка. Шкала считается для ПАРЫ (ученик, курс) — `common/marking.py`.
enum GradingScale { FIVE_POINT PERCENT PASS_FAIL MARKLESS }
# Exercises (R4.1 — RND_01_SPEC_ENGLISH §3/§7.2). Subject-neutral: the same kinds serve
# Russian and astronomy, which is why the app is `exercises`, not `english`.
enum ExerciseKind {
  VOCAB_CARD CLOZE CHOICE WORD_ORDER MATCH LISTENING
  DICTATION PRONUNCIATION SPEAKING WRITING TRANSFORM ROLEPLAY
}
enum SkillArea { VOCAB GRAMMAR LISTENING READING WRITING SPEAKING PRONUNCIATION }
# Where a set is used — and with it whether the journal ever hears about it (§7.4).
enum ExerciseMode { LIVE HOMEWORK PRACTICE }
enum AttemptContext { LIVE HOMEWORK PRACTICE }
enum EnrollmentStatus { ACTIVE COMPLETED PENDING }
enum HomeworkType { FILE TEXT QUIZ }
enum SubmissionStatus { SUBMITTED LATE GRADED }
enum AttendanceStatus { PRESENT ABSENT LATE }
enum RecommendationKind { SCHEDULE COURSE MATERIAL WELLBEING }
enum InsightKind { GOOD WATCH }
enum PointReason { ATTENDANCE HOMEWORK GRADE STREAK }
enum ReviewStatus { VISIBLE PENDING HIDDEN }
enum NotificationType { GRADE NEW_LESSON ABSENCE HOMEWORK_DONE CMF_INSIGHT WEEKLY_DIGEST }
enum NotificationChannel { PUSH EMAIL IN_APP }
# 🔴 BOARD_IMAGE добавлен 17.08 (§28.1.1): картинка на доске уходила в JSONB целиком, base64,
# и рассылалась подпиской каждому в классе. Теперь она идёт тем же путём, что любой файл.
enum UploadPurpose { AVATAR MATERIAL SUBMISSION VERIFICATION COVER INSTITUTION_LOGO BOARD_IMAGE }

# ----------------------------------------------------------------------------- Identity & org
type User {
  id: ID!
  email: String!
  phone: String
  role: Role!
  firstName: String!
  lastName: String!
  # Отчество — необязательное (OWNER_SCOPE §24): его нет у части народов России и у
  # иностранного преподавателя.
  middleName: String!
  # 🔴 Три ГОТОВЫХ имени, чтобы клиент их не склеивал. Правило «преподавателю имя-отчество,
  # ученику имя» — та же ось, что «вы»/«ты», и живёт в ОДНОМ месте, на модели. Повтори его
  # во фронте, и однажды один экран начнёт звать ребёнка по отчеству.
  displayName: String!          # обращение К человеку: Имя Отчество / Имя
  formalName: String!           # упоминание О человеке: Имя Отчество / Имя Фамилия
  fullName: String!             # Фамилия Имя Отчество — документы, карточка надзора
  shortName: String!            # Имя Ф. — там, где мало места
  locale: String!
  isActive: Boolean!
  avatarUrl: String
  createdAt: DateTime!
  # Р5.4 / D2 step 3. Both default to FALSE and both are the caller's own business — `me` is
  # the only query that returns a User for the caller themselves.
  consentSpeech: Boolean!        # речь обрабатывается на лету ради саммари; аудио не хранится
  # ⚠️ Правка 15.08 (OWNER_SCOPE §26.1): анализ внимания приходит ВКЛЮЧЁННЫМ на экране мастера.
  # Поле по-прежнему рождается false, и сервер по-прежнему отбрасывает корзину без согласия —
  # изменилось умолчание экрана, а не право сервера.
  consentAttention: Boolean!
  # Когда подписано согласие 152-ФЗ (при регистрации). Мастер показывает дату вместо метки
  # «обязательно»: галочки там нет, и метка без элемента управления читалась как поломка.
  consent152fzAt: DateTime
  studentProfile: StudentProfile
  teacherProfile: TeacherProfile
  parentProfile: ParentProfile
  adminProfile: AdminProfile
}

type StudentProfile {
  user: User!
  birthDate: DateTime
  ageBand: AgeBand!
  gradeLevel: String
  points: Int!
  """Учится без отметок — дошкольник или первый класс (ФГОС НОО, ФЗ-273). Считается на
  сервере (`common/marking.py`): экраны спрашивают, а не выводят сами."""
  markless: Boolean!
  institution: Institution
}

type TeacherProfile {
  user: User!
  specialty: String
  education: String
  experience: String
  bio: String
  verificationStatus: VerificationStatus!
  # Свои документы (чужому — пустой список). Без них баннер «Документы на проверке» висел у
  # каждого преподавателя: verificationStatus рождается со значением PENDING, и «не загружал»
  # было неотличимо от «жду решения».
  verificationDocuments: [VerificationDocument!]!
  rating: Float
  reviewCount: Int!
}

type ParentProfile {
  user: User!
  children: [StudentProfile!]!
}

type AdminProfile {
  user: User!
  institution: Institution
}

type Institution {
  id: ID!
  name: String!
  address: String
  logoUrl: String
  website: String
  subdomain: String
  status: InstitutionStatus!
  defaultLocale: String!
  branding: JSON          # white-label colors / domain
}

type InstitutionMembership {
  id: ID!
  user: User!
  institution: Institution!
  role: MembershipRole!
  status: MembershipStatus!
  joinedAt: DateTime
}

type Guardianship {
  id: ID!
  parent: User!
  child: User!
  status: GuardianshipStatus!
  consent152fz: Boolean!
  consentAt: DateTime
}

type VerificationDocument {
  id: ID!
  # Ссылка на СВОЙ документ; чужому — null. Раньше здесь стоял выдуманный путь `/files/<key>`,
  # маршрута с таким адресом в продукте нет (находка владельца 2026-08-15, п.4).
  fileUrl: String
  filename: String!
  sizeBytes: Int
  status: VerificationStatus!
  # Причина отказа или «каких документов не хватает» — текстом, а не молчанием (лист D7).
  reason: String!
  reviewedAt: DateTime
  createdAt: DateTime!
}

# ----------------------------------------------------------------------------- Learning content
type Course {
  id: ID!
  title: String!
  description: String
  level: CourseLevel!
  format: CourseFormat!
  subject: String!
  language: String!
  owner: TeacherProfile!
  institution: Institution
  status: CourseStatus!
  coverUrl: String
  sections: [Section!]!
  lessonCount: Int!
  enrollmentCount: Int!
  rating: Float
  createdAt: DateTime!
  updatedAt: DateTime!
  viewerEnrollment: Enrollment   # the calling student's enrollment, if any
}

type Section {
  id: ID!
  title: String!
  description: String
  coverUrl: String
  order: Int!
  lessons: [Lesson!]!
}

type Lesson {
  id: ID!
  title: String!
  description: String
  durationMin: Int!
  options: LessonOptions!
  scheduleRule: JSON           # { type: ONCE|WEEKLY, days: [..], time: "HH:MM" }
  status: LessonStatus!
  order: Int!
  kind: LessonKind!            # EXTERNAL_DEVICE opens the device's page at run time
  deviceKey: String            # only ever set on an EXTERNAL_DEVICE lesson
  materials: [Material!]!
  # Ближайшее назначенное занятие. Без него список из двадцати уроков не отвечал на вопрос
  # «какие уже назначены»: «Назначить занятие» ставило галочку в кнопке и теряло её при
  # перезагрузке (находка владельца 2026-08-15, п.2).
  nextSessionAt: DateTime
  sessions(from: DateTime, to: DateTime): [LessonSession!]!
}

type LessonOptions {
  camera: Boolean!
  screen: Boolean!
  chat: Boolean!
  homework: Boolean!
}

type LessonSession {
  id: ID!
  lesson: Lesson!
  group: Group
  startAt: DateTime!
  endAt: DateTime
  status: SessionStatus!
  # К какому курсу относится занятие. Расписание — единственное место, где занятия ВСЕХ курсов
  # лежат рядом, и без названия курса тридцать строк подряд не отвечают, к чему готовиться
  # (находка владельца 2026-08-15, п.2).
  courseTitle: String!
  courseId: ID!
  roomToken: String            # null unless viewer is a participant of a live session
  teacherName: String          # course owner's display name; any session participant (NOT the roster)
  # Р5.1 (owner, 2026-08-13): a student's video strip shows the teacher and their own preview
  # and nothing else, so the client must be able to tell WHICH remote is the teacher. This is
  # the one id here — the roster stays teacher-only. Without it the client had to guess «the
  # teacher is the only remote», which stops being true the moment a second person joins.
  teacherId: ID
  attendance: [Attendance!]!
  attentionSummary: AttentionSummary   # teacher: class summary after the session
}

type Material {
  id: ID!
  type: MaterialType!
  title: String!
  fileUrl: String
  url: String
  body: String
  order: Int!
}

type Enrollment {
  id: ID!
  student: StudentProfile!
  course: Course!
  status: EnrollmentStatus!
  progressPct: Int!
  viewedLessonIds: [ID!]!
  enrolledAt: DateTime!
}

# ----------------------------------------------------------------------------- Groups (institutional)
type Group {
  id: ID!
  institution: Institution!
  name: String!
  level: String
  students: [StudentProfile!]!
  teachers: [GroupTeacher!]!
}

type GroupTeacher {
  id: ID!
  teacher: TeacherProfile!
  subject: String!
}

# ----------------------------------------------------------------------------- Assessment & progress
type Homework {
  id: ID!
  title: String!
  description: String
  type: HomeworkType!
  dueAt: DateTime
  allowRedo: Boolean!
  # Название курса одной строкой: у задания НА УРОК поле `course` пустое, и курс достаётся
  # через lesson.section.course — путь, которого у клиента нет (тип Lesson секции не отдаёт).
  courseTitle: String
  course: Course
  lesson: Lesson
  group: Group
  createdBy: User!
  publishedAt: DateTime
  submissions: [Submission!]!
  submissionStats: SubmissionStats!
  viewerSubmission: Submission   # the calling student's latest attempt
}

type SubmissionStats {
  total: Int!
  submitted: Int!
  graded: Int!
  late: Int!
}

type Submission {
  id: ID!
  homework: Homework!
  student: StudentProfile!
  attempt: Int!
  contentText: String
  status: SubmissionStatus!
  submittedAt: DateTime
  score: Int
  """Этому ученику отметок не ставят: дошкольник или первый класс (ФГОС НОО, ФЗ-273).
  Правило считается на сервере (`common/marking.py`); экран только показывает."""
  markless: Boolean!
  comment: String
  gradedBy: User
  gradedAt: DateTime
  files: [SubmissionFile!]!
}

type SubmissionFile {
  id: ID!
  fileUrl: String!
  name: String!
}

type Attendance {
  id: ID!
  session: LessonSession!
  student: StudentProfile!
  status: AttendanceStatus!
  joinedAt: DateTime
}

type Certificate {
  id: ID!
  student: StudentProfile!
  course: Course!
  pdfUrl: String!
  verificationId: ID!
  issuedAt: DateTime!
}

# Public verification result (no auth) for /verify/{verificationId}
type CertificateVerification {
  valid: Boolean!
  studentName: String
  courseTitle: String
  institutionName: String
  issuedAt: DateTime
}

# ----------------------------------------------------------------------------- SEduM (CMF) — aggregates only
type AttentionMetric {
  id: ID!
  sessionId: ID!
  studentId: ID!
  bucketStart: DateTime!
  avgAttention: Int!           # 0..100 (engagement composite; persisted)
  # Per-bucket aggregate sub-metrics — LIVE-ONLY (broadcast for the realtime teacher view,
  # NOT persisted; the DB stores only avgAttention). Aggregate scalars, never raw/frames.
  gazeOnScreen: Int            # 0..100 (% on-screen)
  eyeOpenness: Int             # 0..100
  headYaw: Int                 # degrees (signed)
  headPitch: Int               # degrees (signed)
  alertness: Int               # 0..100 (alert vs drowsy)
}

type AttentionPoint { at: DateTime! value: Int! }

type AttentionSummary {
  averageAttention: Int!
  peak: Int!
  low: Int!
  points: [AttentionPoint!]!
}

type SubjectAttention { subject: String! averageAttention: Int! }
type DailyAttention { weekday: Int! averageAttention: Int! }   # 1=Mon..7=Sun
type Insight { kind: InsightKind! text: String! }

type AttentionAnalytics {
  averageAttention: Int!
  bySubject: [SubjectAttention!]!
  byWeekday: [DailyAttention!]!
  insights: [Insight!]!
}

type GroupAnalytics {
  group: Group!
  averageAttention: Int!
  averageGrade: Float
  attendancePct: Int!
  students: [StudentStat!]!
  attentionBySession: [AttentionPoint!]!
  insights: [Insight!]!
}

type StudentStat {
  student: StudentProfile!
  averageAttention: Int
  averageGrade: Float
  attendancePct: Int!
}

type Recommendation {
  id: ID!
  kind: RecommendationKind!
  title: String!
  body: String!
  payload: JSON
  dismissed: Boolean!
  createdAt: DateTime!
}

# UBP backup is opaque to the server (client-side encrypted). Opt-in.
type UbpBackup {
  encryptedBlob: String!       # base64
  keyHint: String
  updatedAt: DateTime!
}

# ----------------------------------------------------------------------------- Engagement
# 🔴 REMOVED 2026-08-13 by owner decision: `LeaderboardEntry` and the `leaderboard` query.
# No leaderboards, and no comparing children with each other — only with who they were. The
# type is deleted rather than left unimplemented: a shape in the contract is an invitation,
# and the next person to read this file should not find one.
#
# `Achievement` now means what R4.4 built (apps/exercises): a milestone one learner passed,
# keyed by an enum in which every member is a fact about that person's own history. The old
# catalogue shape (code/title/icon/criteria) and `UserAchievement` are gone with it — a
# server-authored title would also have broken the i18n rule.
type PointEvent { id: ID! reason: PointReason! amount: Int! createdAt: DateTime! }

type Review {
  id: ID!
  teacher: TeacherProfile!
  author: User!
  rating: Int!
  text: String
  status: ReviewStatus!
  createdAt: DateTime!
}

# ----------------------------------------------------------------------------- Platform
type Notification {
  id: ID!
  type: NotificationType!
  title: String!
  body: String
  payload: JSON
  isRead: Boolean!
  createdAt: DateTime!
}

type NotificationPreference {
  id: ID!
  eventType: NotificationType!
  channel: NotificationChannel!
  enabled: Boolean!
  child: User                  # for parents: per-child override
}

# The LESSON chat (R4.2) — it lives inside the lesson summary, as its CHAT section. Not to be
# confused with ChannelMessage below, which is the standing chat between people (R2).
# There is no separate lesson feed: sending a message here WRITES a SummaryItem, so
# «переписка едет вместе с итогом» is true of the schema and not only of the screen.
# CHANGED in R4.2: sender: User! -> flat senderId + senderName, matching BoardElement. A
# summary line needs a name, not a user object, and a nested User would drag a whole profile
# into every chat message.
type ChatMessage {
  id: ID!
  sessionId: ID!
  senderId: ID!
  senderName: String!
  text: String!
  sentAt: DateTime!
}

# ----------------------------------------------------------------------------- Chat (R2)
# Channels: предмет × группа · ученик ↔ учитель · ученик ↔ ученик · учительская.
# Membership IS the authorisation: a channel the caller is not in comes back as NotFound,
# never as a refusal that confirms it exists.
type ChatParticipant {
  id: ID!
  firstName: String!
  lastName: String!
  # Готовые имена — те же правила, что у User (§24). Заголовок канала берёт displayName,
  # список участников — shortName.
  displayName: String!
  shortName: String!
  role: String!
}

type ChannelMessage {
  id: ID!
  channelId: ID!
  senderId: ID!
  senderName: String!
  text: String!
  sentAt: DateTime!
  mine: Boolean!
}

# No `title`: the server sends the data a title is built from and the client words it.
type ChatChannel {
  id: ID!
  kind: ChannelKind!
  courseId: ID
  courseTitle: String
  groupName: String
  institutionName: String
  participants: [ChatParticipant!]!
  unread: Int!
  lastMessageAt: DateTime
  lastMessageText: String
  readOnly: Boolean!          # reading a REPORTED conversation one is not part of
  openReports: Int!
}

# Advisory only — every one of these is enforced server-side. peerChat comes from the
# jurisdiction matrix (feature `peer_chat`); the rest are institution-level options.
type ChatPolicyView {
  peerChat: Boolean!
  directMessages: Boolean!
  teacherVisibleAlways: Boolean!
  premoderation: Boolean!
}

type ChatReport {
  id: ID!
  channelId: ID!
  reporterName: String!
  reason: String
  status: ReportStatus!
  createdAt: DateTime!
}

# ----------------------------------------------------------------------------- Auth / utility payloads
type AuthPayload { token: String! refreshToken: String! user: User! }
type UploadTicket { uploadUrl: String! fileKey: String! expiresAt: DateTime! }

# Правила загрузки — числами и ДО попытки (находка владельца 2026-08-15, п.3). Правила жили
# только на сервере и срабатывали ПОСЛЕ выбора файла: человек выбирал ролик, ждал и получал
# отказ. Запрос, а не константа в клиенте: константа разошлась бы с политикой молча.
type UploadPolicy { purpose: UploadPurpose! maxBytes: Int! contentTypes: [String!]! }
type SessionJoin { session: LessonSession! roomToken: String! }

# ----------------------------------------------------------------------------- Exercises (R4.1)
# `answerKey` is deliberately ABSENT from this type and always will be: a key on the wire is
# a test that answers itself. It lives on the model; the resolver does not expose it.
type Exercise {
  id: ID!
  kind: ExerciseKind!
  skill: SkillArea!
  cefrLevel: String
  skillTags: [String!]!
  prompt: JSON!
  payload: JSON!
  points: Int!
  order: Int!
  assetId: ID                    # a listening clip / picture is a lesson Material
}

type ExerciseSet {
  id: ID!
  lessonId: ID!
  title: String!
  mode: ExerciseMode!
  homeworkId: ID                 # set for HOMEWORK — the join to the existing journal
  exercises: [Exercise!]!
}

# Append-only: a retake is a new row, never an edit (§4.2 п.4).
type Attempt {
  id: ID!
  exerciseId: ID!
  context: AttemptContext!
  isCorrect: Boolean             # null while an open kind waits for a person
  score: Int!
  createdAt: DateTime!
}

# The teacher's live view of one question: counts and a spread, never who answered what.
type ExerciseLiveRow {
  exerciseId: ID!
  answered: Int!
  groupSize: Int!
  correct: Int!
  spread: JSON!                  # option index -> how many picked it
}

type SetProgress { total: Int! answered: Int! correct: Int! }

# BKT over a skill tag (§7.3) — «has this learner got the rule yet?». Not spaced repetition:
# that is about items and lives elsewhere.
type SkillMastery { skillTag: String! pKnown: Float! opportunities: Int! }

type HomeworkHandIn {
  submissionId: ID!
  score: Int
  autoChecked: Int!
  awaitingTeacher: Int!          # what still needs a person to read it
}

# ----------------------------------------------------------------------------- Dictionary (R4.3)
# Owner decision 2026-08-12 (sheet 02): only OPEN bases go inside the product — Open English
# WordNet (CC BY 4.0), Tatoeba (CC BY 2.0 FR), Mozilla Common Voice (CC0). A closed dictionary
# is a LINK that opens in a new tab: never a row in a table, never a request from our server.
# The enum below IS that decision — a closed base has no member to be added under.
enum LexicalSource { WORDNET TATOEBA COMMON_VOICE OWN }
enum PartOfSpeech { NOUN VERB ADJECTIVE ADVERB PHRASE OTHER }

# Who to credit and under what. On the wire because the CARD shows it: an open licence is
# still a licence, and these three strings are why we may show the content at all.
type Attribution {
  source: LexicalSource!
  license: String!
  attribution: String!
  sourceUrl: String
}

type LexicalExample {
  id: ID!
  text: String!
  translationRu: String
  credit: Attribution!           # its own — a Tatoeba sentence is not a WordNet gloss
}

# One SENSE. The card on the sheet is every sense of a lemma, stacked.
type LexicalItem {
  id: ID!
  lemma: String!
  pos: PartOfSpeech!
  senseId: String
  cefrLevel: String
  ipa: String
  definitionRu: String
  translationRu: String
  pronunciationId: ID            # a Material id — never a media blob on this type
  credit: Attribution!
  examples: [LexicalExample!]!
}

# A closed dictionary, as data, so the client renders exactly the tested list — and so that
# adding one is visibly a LINK and not a new source of content.
type ExternalDictionary { key: String! name: String! url: String! }

# «Показать всем»: an id and the lemma. Stored nowhere — a gesture, like the projector focus.
type WordShown { sessionId: ID! itemId: ID! lemma: String! }

# ----------------------------------------------------------------------------- Repetition (R4.3/R4.4)
# FSRS over ITEMS, never SM-2, and never the same thing as SkillMastery (BKT over RULES) —
# spec §7.3 devotes a table to keeping the two apart.
enum CardDirection { RECOGNITION RECALL }
enum CardState { NEW LEARNING REVIEW RELEARNING }

# «В мои слова» creates one of these, due now. The word list IS the queue: there is no second
# list to keep in sync with it.
type SrsCard {
  id: ID!
  item: LexicalItem!
  direction: CardDirection!
  state: CardState!
  dueAt: DateTime!
  reps: Int!
  lapses: Int!
}

# The four FSRS grades, named rather than numbered so the contract does not depend on the
# library's integer ordering staying put.
enum ReviewRating { AGAIN HARD GOOD EASY }

# A card as the review screen needs it: the word, plus the state to schedule the next one
# from. FSRS itself runs on the CLIENT (ts-fsrs, MIT) — the server keeps the record, decides
# whose card it is, and clamps a schedule that could not have come from a scheduler.
type DueCard {
  id: ID!
  item: LexicalItem!
  direction: CardDirection!
  state: CardState!
  stability: Float!
  difficulty: Float!
  dueAt: DateTime!
  lastReviewAt: DateTime
  reps: Int!
  lapses: Int!
  learningSteps: Int!            # FSRS short-term state; without it the steps restart
}

# 🔴 One learner's own numbers. There is no field here that could be compared with another
# child and no query that returns anybody else's — `longestStreak` is the same person's best.
type RepetitionProgress {
  total: Int!
  due: Int!
  learning: Int!
  mastered: Int!
  reviews: Int!
  currentStreak: Int!
  longestStreak: Int!
}

# Every member is a fact about one person's own history. None can be earned by being ahead of
# somebody else — that is the owner's rule expressed as an enum, not as restraint in the UI.
enum AchievementKey {
  FIRST_WORD TEN_WORDS FIFTY_WORDS
  FIRST_MASTERED TEN_MASTERED
  STREAK_3 STREAK_7 STREAK_30
  HUNDRED_REVIEWS
}

type Achievement { key: AchievementKey! earnedAt: DateTime! }

# ----------------------------------------------------------------------------- Board (R3.2)
# Boards and mind-maps are on the storage whitelist (§4.2 п.2) — they are what a lesson leaves
# behind now that no recording exists. Named BoardSnapshot deliberately (§2.8): the
# storage-policy gate greps this file for media words, and a board is not one.
type BoardElement {
  id: ID!
  kind: BoardElementKind!
  authorId: ID!
  authorName: String!            # sheet 02: you can always see who put a thing on the board
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  data: JSON!                    # kind-specific; an IMAGE carries a stored object key
  revision: Int!                 # counts writes — last write wins, nothing is locked
}

type Board {
  lessonId: ID!
  openForStudents: Boolean!      # the teacher's switch; a learner is TOLD the state
  canWrite: Boolean!
  isTeacher: Boolean!
  elements: [BoardElement!]!
}

type BoardSnapshot {
  id: ID!
  title: String!
  savedAt: DateTime!
  savedByName: String!
  lessonId: ID!
  lessonTitle: String!
  elements: JSON!                # frozen, so a saved board keeps showing what it showed
}

type BoardChange {
  lessonId: ID!
  kind: String!                  # element | removed | access
  element: BoardElement
  elementId: ID
  openForStudents: Boolean
}

input BoardElementInput {
  kind: BoardElementKind!
  x: Float = 0
  y: Float = 0
  width: Float = 0
  height: Float = 0
  data: JSON
  id: ID                         # present when updating, absent when putting a new one down
}

# ----------------------------------------------------------------------------- Summary (R4.2)
# The summary is what a lesson leaves behind now that no recording exists — first on the
# storage whitelist (§4.2 п.1), and that entry carries the clause that shapes this whole
# block: «чат занятия — отдельный раздел внутри саммари».
#
# Two things this contract deliberately does NOT contain, and the storage gate greps for both:
# no field holds recognised speech, and no field holds a server-composed caption. An item
# ships `source` + `sourceMeta`; the client turns that into «с доски · 4 узла, добавил Петя».
# Speech itself never reaches a field at all — points come from an in-memory buffer that is
# dropped in the same call that reads it (apps/summaries/speech_stream.py).
enum SummaryStatus { DRAFT SENT }

# The five blocks of atlas sheet 02.
enum SummarySection { TOPIC WORDS WATCH CHAT HOMEWORK }

# Where a line came from — shown under every single item on the sheet.
# SPEECH is the one gated source: `lesson_transcription` in the jurisdiction matrix AND the
# speaker's own consent (a minor's via their guardian's 152-FZ one).
enum SummarySource { PLAN BOARD SPEECH MATERIAL TEST CHAT TEACHER }

type SummaryItem {
  id: ID!
  section: SummarySection!
  source: SummarySource!
  sourceMeta: JSON!              # counts, names, ids — the client composes the caption
  atOffsetSec: Int               # the «06:20» column; null on items that are not a moment
  text: String!
  authorId: ID
  authorName: String!
  dueAt: DateTime
  homeworkId: ID                 # set once the item became a real row in «Задания»
  edited: Boolean!               # a person wrote/rewrote it — assembly leaves it alone
}

type LessonSummary {
  id: ID!
  sessionId: ID!
  status: SummaryStatus!
  intro: String!
  assembledAt: DateTime
  sentAt: DateTime
  speechOmitted: Boolean!        # points were dropped: jurisdiction or a missing consent
  canEdit: Boolean!
  items: [SummaryItem!]!
}

# ----------------------------------------------------------------------------- Devices (Р5.0)
# The pilot hosts the lesson from the teacher's laptop, so the laptop needs a key. Owner
# decision 14.08 (OWNER_SCOPE §19.4): **the app never asks for a password.** It shows a code,
# the teacher signs in inside a real browser — address bar and padlock visible — and types it.
#
# Two things this block deliberately does not contain: any field carrying a password, and any
# way to read a machine key back. The key is returned exactly once, in DeviceClaim, and after
# that lives only in the machine's OS keychain. Both absences are asserted by test_devices.py.
enum DevicePlatform { MACOS WINDOWS LINUX OTHER }

type Device {
  id: ID!
  name: String!                  # «MacBook Ирины» — for telling two machines apart, nothing else
  platform: DevicePlatform!
  appVersion: String!
  lastSeenAt: DateTime
  online: Boolean!               # derived from the heartbeat, never a stored flag
  pairedAt: DateTime!
  uplink: UplinkAssessment       # Р5.1; null until this machine has measured once — an
                                 # unmeasured channel and a dead one are different facts
  setup: DeviceSetup!            # Р5.4 / D2 — the five steps of the first run
}

# What the app gets when it asks. `secret` is its half of the credential, returned once and
# stored as a hash: the code proves a human approved, the secret proves this is the machine
# that asked. Holding one without the other gets you nothing.
# Where a copy of the cabinet goes (D2 step 2, OWNER_SCOPE §19.1). NONE describes a machine
# that has not reached step 2 — it is not a choice the screen offers, and the server refuses
# to finish setup in it.
enum BackupKind { NONE EXTERNAL_DISK CLOUD_FOLDER }

# Что получилось из копии кабинета (Р5.5) — числа, а не «успешно».
#
# 🔒 Пути здесь нет и не будет. Файл кладётся в саму папку кабинета; наружу — на внешний диск
# или в папку облака — его переносит оболочка. Адрес, который выбрал преподаватель, живёт на
# машине и в операцию не попадает (test_first_run.py, noPassword.test.ts).
type CabinetBackup {
  createdAt: DateTime!
  # Р5.5-Б — ИМЯ файла, не путь. Копию наружу переносит оболочка: она назначила папку кабинета
  # при запуске sidecar и знает, откуда забирать. Адрес, выбранный преподавателем, живёт на
  # машине и через GraphQL не ходит — то же правило, что и для папки кабинета.
  fileName: String!
  sealed: Boolean!               # для копии, уходящей к нам, — всегда true (§19.1)
  rows: Int!
  files: Int!                    # байты работ едут внутри файла, а не ссылками на них
  tables: Int!
}

# How far this machine's first run got, so an interrupted setup resumes on the same step.
#
# 🔒 There is no field here for the cabinet FOLDER and there will not be one. §19.1 makes the
# copy mandatory, so whether one is configured is ours to know; where it lives is the teacher's
# own disk and their OS account name, and it stays on the machine. Asserted by test_first_run.py.
type DeviceSetup {
  step: Int!                     # 1…5 — вход · данные · согласия · проверка · готово
  completed: Boolean!
  backupKind: BackupKind!
  backupConfiguredAt: DateTime
  cloudCopyEnabled: Boolean!     # «копия у нас, по желанию» — client-encrypted, opaque to us
  lastBackupAt: DateTime
  # Р5.5-В п.3 — пора ли снимать копию. Планировщика нет и не будет (Celery отложен): расписание
  # §19.1 исполняет само приложение — при старте и по окончании занятия.
  backupDue: Boolean!
}

# Р5.6 / лист D3 — «Участники · 8». Каждое состояние выводится из существующего признака.
enum ParticipantState {
  IN_ROOM        # есть запись присутствия на идущем занятии
  AT_THE_DOOR    # «открыла ссылку, ждёт» — открывал дверь недавно, в комнату не вошёл
  INVITED        # «приглашение открыто вчера»
  NEVER_OPENED   # «ссылка не открывалась ни разу» — сильное утверждение, и теперь оно опирается
                 # на отметку об открытии, а не на догадку
}

type MeetingParticipant {
  studentId: ID!
  name: String!
  state: ParticipantState!
  since: DateTime               # у «никогда» времени нет
}

type PairingRequest { code: String! secret: String! expiresAt: DateTime! }

# The machine key, handed over once and never queryable.
# 🔴 §Б0-септ (владелец, 15.08). Связывание отдаёт машине не только её ключ, но и СЕССИЮ
# того преподавателя, который подтвердил код в браузере. Без неё мастер доходил до
# «Приложение настроено», а «Открыть кабинет» вела обратно в мастер: кабинет, расписание,
# курсы и комната урока стоят за пользовательской сессией, а у приложения был только ключ.
# Граница «машина ≠ человек» цела — приложение получает обычную сессию вдобавок к ключу,
# а не ключ с расширенными правами.
type DeviceSession { token: String! refreshToken: String! displayName: String! }
type DeviceClaim { device: Device! token: String! session: DeviceSession! }

# ----------------------------------------------------------------------------- Meeting point (Р5.0)
# Atlas D3. The link belongs to the GROUP, not to the lesson: a fresh link every week is a
# mailout half the class loses. A six-character code sits beside it for the people who would
# rather read it out than forward it.
#
# Everything here answers WITHOUT the teacher's machine — that is the whole point of the app.
# A pupil arriving at 17:59 learns when the lesson is, whether the host is up, and what works
# meanwhile, from the server, with the laptop asleep.
enum MeetingAccessMode { GROUP_ONLY ANY_AUTHENTICATED KNOCK }

# What the arrival is told. Never a bare «нет»: a stranger gets «вы не в этой группе» with a
# way to ask, and an old link says it was REPLACED rather than that it never existed.
enum JoinDecision { ALLOWED NOT_IN_GROUP KNOCK_REQUIRED LINK_REPLACED }

# Reachable while the host is off — one source (apps/meetingpoint/capabilities.py) so the
# offline screen and the future desktop refusals cannot disagree.
#
# The line is drawn by WHOSE DATA IT IS (owner decision 14.08, OWNER_SCOPE §20.2/§20.3), not
# by what is technically convenient: a pupil's own work, grades and summaries come from their
# mirror and open always; the teacher's guides, the live board and the room need their
# machine. Writing homework is never blocked — «ответ уйдёт сам, когда преподаватель появится».
type OfflineCapabilities {
  schedule: Boolean!
  chat: Boolean!
  homework: Boolean!
  myWork: Boolean!
  myGrades: Boolean!
  mySummaries: Boolean!
  # Р5.4-Б расширил зеркало (§20.5.1) — обещание экрана «нет в сети» расширилось с ним. D3:
  # «недоступна только живая доска и методички ЭТОГО урока»; выданное уже принадлежит ученику.
  myDiary: Boolean!
  myBoards: Boolean!
  myMaterials: Boolean!
  lessonMaterials: Boolean!
  liveBoard: Boolean!
  room: Boolean!
}

# ----------------------------------------------------------------------------- Pupil mirror (Р5.0-Б)
# Owner decision 14.08 (OWNER_SCOPE §20.3), verbatim: «в любом случае данные сохраняются
# у ученика — то есть он должен иметь возможность получить доступ к этим документам».
# A teacher leaving the platform must not take a child's schooling with them, so this is a
# SECOND place the data lives, not a setting.
#
# The ownership boundary is one rule with no exceptions — **выдал классу → появилось у ученика;
# не выдал → своё** — and this enum IS that boundary: there is no member a programme, a guide
# or an unshared board draft could be written under.
# Состав того, что лежит у ученика — OWNER_SCOPE §20.5.1, расширено в Р5.4-Б.
#
# ⚠️ Граница §20.5.2 при этом не сдвинулась, она сменила форму: MATERIAL и BOARD появились
# потому, что ВЫДАННАЯ методичка и СОХРАНЁННАЯ доска принадлежат ученику. Что не выдано, сюда
# не попадает — не потому, что вида нет, а потому, что нет события: MATERIAL пишется только из
# share_material, BOARD — из сохранения доски, SUMMARY — из отправки.
enum MirrorKind {
  WORK          # работы, все попытки и пересдачи, с файлами
  SUMMARY       # саммари занятия, чат занятия внутри
  ACHIEVEMENT   # достижения
  CHAT          # его чаты
  DIARY         # занятие: когда, был ли, что получил, и оборвалось ли оно само
  BOARD         # доски и майндмапы его занятий
  MATERIAL      # выданные методички и материалы — содержимым
  # 🔴 §27.2 (решение владельца 17.08): «мои материалы» — личная папка ученика, и она
  # принадлежит ему навсегда (§20.5). В коде значение живёт с того же дня; в этот контракт
  # его забыли внести, и экран «Моя учёба» уткнулся в это 19.08 (промпт 36 §2).
  # Хранится ССЫЛКА и заметка, никогда не копия: лицензия едет с источником.
  SAVED         # то, что ученик сохранил себе сам — из урока или из хаба источников
}

type JournalStudent { studentId: ID!  name: String!  markless: Boolean! }
type JournalSession { sessionId: ID!  title: String!  startAt: DateTime  status: String! }
type JournalCell { studentId: ID!  sessionId: ID!  attendance: String!  score: Int }
type CourseJournal {
  courseId: ID!
  title: String!
  students: [JournalStudent!]!
  sessions: [JournalSession!]!
  # Клетки ПЛОСКИМ списком: матрица в GraphQL — это либо нетипизируемый JSON, либо список
  # списков, у которого порядок держится на честном слове.
  cells: [JournalCell!]!
}

type MirroredRecord {
  id: ID!
  kind: MirrorKind!
  sourceId: ID!                  # the original's id. NOT a foreign key — an FK would cascade
                                 # away with the teacher's course, on exactly the day this matters
  occurredAt: DateTime!          # when it happened, not when it synced
  updatedAt: DateTime!
  # Two rules, not one (owner correction 14.08, OWNER_SCOPE §20.4.1):
  #   * the LESSON's video, audio and verbatim transcript are forbidden here as everywhere —
  #     CLAUDE.md §2.2 governs both storage points;
  #   * a child's work belongs to the child WHOLE. Files they attached — an essay, a photo of
  #     a solution, a recording of themselves reading aloud — ride in `attachments` as
  #     {name, objectKey, sizeBytes} and open through `mirroredFileUrl`, always.
  # A WORK record is also one ATTEMPT with every answer inside it (§20.4.2): «ученик получает
  # документ, а не журнал событий».
  payload: JSON!
}

type UpcomingLesson { sessionId: ID! title: String! startAt: DateTime! isLive: Boolean! }

type MeetingPointView {
  slug: String!
  decision: JoinDecision!
  groupName: String!             # empty on a replaced link — a dead link tells a stranger nothing
  teacherName: String!
  hostOnline: Boolean!
  nextLesson: UpcomingLesson
  capabilities: OfflineCapabilities!
}

# The teacher's own view of their group's front door.
type MeetingPoint {
  groupId: ID!
  slug: String!
  code: String!
  accessMode: MeetingAccessMode!
  hostOnline: Boolean!
  # 🔴 Ключ встречи у группы (решение владельца 17.08, §27.4). Без него «Начать урок» на
  # листе D3 обещало комнату и вело в расписание. Ученику это поле отдавалось всегда
  # (MeetingPointView.nextLesson) — преподаватель был единственным, кому его не показывали.
  # null — занятия впереди нет, и кнопка обязана сказать это словами.
  nextLesson: UpcomingLesson
}

# A slug and a boolean. Nothing about where the machine is or what it is doing.
type HostPresence { slug: String! online: Boolean! }

# ----------------------------------------------------------------------------- Signalling (Р5.1)
# The only thing the server does for a lesson's media. Two browsers behind two routers cannot
# find each other; this passes them each other's offers and addresses, and then the packets go
# peer to peer — or through TURN when a network refuses one (20-40% of real networks, per
# R5_DESKTOP_HOST_BUDGET.md §1). **No media crosses the API.**
#
# `apps/signalling` has no model, deliberately: an SDP carries IP addresses and codec detail,
# and a routing message that outlives the call it routed is a record of who was where, kept
# for nobody. test_signalling.py asserts the absence rather than trusting it.
enum SignalKind { OFFER ANSWER ICE BYE }

type Signal {
  sessionId: ID!
  fromPeer: ID!
  toPeer: ID!
  kind: SignalKind!
  payload: String!               # the SDP or ICE candidate, opaque to us: routed, not read
}

# A short-lived relay credential (coturn REST scheme). The username IS the expiry and the
# password is its HMAC, so a credential read out of a browser's memory is dead within the
# hour, no account exists on the relay, and the secret never leaves the server.
# `configured` is false when no relay is set up — said out loud, because a lesson that
# silently has no relay fails only for the pupils whose network needed one.
type TurnCredentials {
  urls: [String!]!
  username: String!
  credential: String!
  ttlSeconds: Int!
  configured: Boolean!
}

# ----------------------------------------------------------------------------- Uplink (Р5.1)
# The teacher's outbound channel decides how big a group is possible: 1.1 / 2.4 / 4.3 Mbit/s
# for 2 / 4 / 8 (budget §3, Р5.1 video mode). The measurement runs on the teacher's machine
# over the same path the media will take; there is deliberately NO upload endpoint on the API.
#
# 🔴 The verdict never blocks a lesson (OWNER_SCOPE §19.3 — «предупреждаем, не запрещаем»).
enum UplinkVerdict { COMFORTABLE WORKABLE TIGHT TOO_WEAK UNKNOWN }

# How the media actually got there. RELAY means the network refused a direct path and every
# packet is going through our server — worth knowing before blaming the laptop.
enum ConnectionType { DIRECT RELAY UNKNOWN }

type UplinkAssessment {
  mbps: Float!
  verdict: UplinkVerdict!
  groupSize: Int!                # the largest group this channel carries; 0 when it carries none
  requiredForEight: Float!
  stale: Boolean!                # a measurement from this morning is about a different evening
  connectionType: ConnectionType!
}

# The measurement's own parameters, served rather than hardcoded on both sides.
type UplinkProbe {
  seconds: Int!
  requiredForTwo: Float!
  requiredForFour: Float!
  requiredForEight: Float!
}

# ----------------------------------------------------------------------------- Second screen (R3.1)
# The cast model: the teacher reads a short code off their screen and types it on a tablet —
# no second login. What the code buys is the narrowest thing that works: a subscriber-only,
# HIDDEN LiveKit token for this session, briefly, revoked when the lesson ends. Hidden is what
# keeps a second screen a SCREEN and not another participant in the room.
type ProjectorCast {
  code: String!
  expiresAt: DateTime!
  sessionId: ID!
}

type ProjectorJoin {
  sessionId: ID!
  lessonTitle: String!          # enough to caption the screen; nothing about the people
  roomToken: String!            # canPublish=false, hidden=true
}

# F3.1: which participant the second screen enlarges. An id and the session — no metric.
type ProjectorFocus {
  sessionId: ID!
  studentId: ID
}

# ----------------------------------------------------------------------------- Composite read models (power the prototyped screens)
type StudentDashboard {
  today: [LessonSession!]!
  enrollments: [Enrollment!]!
  recommendations: [Recommendation!]!
  points: Int!
  rank: Int
}

type TeacherDashboard {
  courses: [Course!]!
  upcomingSessions: [LessonSession!]!
  pendingSubmissions: [Submission!]!
  studentCount: Int!
  newStudentsThisWeek: Int!
  classAttentionAverage: Int
}

type ParentChildOverview {
  child: StudentProfile!
  todaySchedule: [LessonSession!]!
  recentGrades: [Submission!]!
  attendancePct: Int!
  attentionAverage: Int!
  attentionWeek: [DailyAttention!]!
}

type AdminDashboard {
  activeUsers: Int!
  averageAttention: Int!
  attendancePct: Int!
  averageGrade: Float
  problemGroups: [GroupStat!]!
}

type GroupStat {
  group: Group!
  averageAttention: Int!
  averageGrade: Float
  attendancePct: Int!
}

# ----------------------------------------------------------------------------- Pagination
type PageInfo { hasNextPage: Boolean! endCursor: String }
type CourseConnection { nodes: [Course!]! pageInfo: PageInfo! totalCount: Int! subjectCount: Int! }
type NotificationConnection { nodes: [Notification!]! pageInfo: PageInfo! totalCount: Int! }

# =============================================================================
# Inputs
# =============================================================================
input RegisterUserInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
  role: Role!
  middleName: String = ""       # отчество, необязательное (§24)
  locale: String = "ru"
  # 🔴 R-04 (аудит 14.08). Согласие 152-ФЗ спрашивали на экране и выбрасывали: поля не было ни
  # здесь, ни в бэкенде, и юридически согласия не существовало нигде. CLAUDE.md §2.3 требует
  # его ПРИ РЕГИСТРАЦИИ. Для ученика младше 18 сервер без него откажет — по вычисленной из
  # даты рождения группе, а не по тому, что выбрали в форме.
  consent152fz: Boolean = false
  student: StudentInfoInput      # required when role = STUDENT (teen/adult self-signup)
  teacher: TeacherInfoInput      # required when role = TEACHER
}
input StudentInfoInput { birthDate: DateTime gradeLevel: String parentEmail: String }
input TeacherInfoInput { specialty: String education: String experience: String }

input AddChildInput {
  firstName: String!
  lastName: String!
  gradeLevel: String
  birthDate: DateTime
  childEmail: String             # if the child already has / will get an account
  consent152fz: Boolean!         # parental consent at creation
}

input UploadRequestInput { filename: String! contentType: String! purpose: UploadPurpose! }

input CourseInput {
  title: String!
  description: String
  level: CourseLevel!
  format: CourseFormat = PROGRAM
  subject: String!
  language: String = "ru"
  institutionId: ID
  groupId: ID
  coverKey: String
}
input SectionInput { title: String! description: String coverKey: String }
input LessonOptionsInput { camera: Boolean = true screen: Boolean = true chat: Boolean = true homework: Boolean = false }
input LessonInput {
  title: String!
  description: String
  durationMin: Int!
  options: LessonOptionsInput
  scheduleRule: JSON
  # A telescope lesson stays a lesson in the programme and opens the device's page at run
  # time (atlas 01, owner answer 1). The teacher's edit mode is where this is set; the key
  # is cleared whenever the kind goes back to STANDARD.
  kind: LessonKind
  deviceKey: String
}
input MaterialInput {
  lessonId: ID
  courseId: ID
  type: MaterialType!
  title: String!
  fileKey: String
  url: String
  body: String
}
input ScheduleSessionInput { lessonId: ID! groupId: ID startAt: DateTime! }

input HomeworkInput {
  title: String!
  description: String
  type: HomeworkType!
  dueAt: DateTime
  allowRedo: Boolean = false
  lessonId: ID
  courseId: ID
  groupId: ID
}
input SubmitHomeworkInput { homeworkId: ID! contentText: String fileKeys: [String!] }
# `score` необязателен: дошкольники и первый класс проверяются СЛОВАМИ (ФГОС НОО, ФЗ-273).
# Сервер отказывает, если отметку прислали безотметочному ученику (`common/marking.py`).
input GradeInput { submissionId: ID! score: Int comment: String allowRedo: Boolean }

input InviteInput { institutionId: ID! email: String! role: MembershipRole! groupId: ID }
input InstitutionInput { name: String! address: String website: String subdomain: String logoKey: String defaultLocale: String = "ru" }
input GroupInput { institutionId: ID! name: String! level: String }

input AttentionInput { sessionId: ID! bucketStart: DateTime! avgAttention: Int! gazeOnScreen: Int eyeOpenness: Int headYaw: Int headPitch: Int alertness: Int }   # sub-metrics: per-bucket aggregate scalars, live-only (not persisted)
input UbpBackupInput { encryptedBlob: String! keyHint: String }
input NotificationPreferenceInput { eventType: NotificationType! channel: NotificationChannel! enabled: Boolean! childId: ID }

input CourseFilter { level: CourseLevel format: CourseFormat subject: String language: String search: String }

# One of the educations inside a single account (owner req. 15, atlas sheet 00).
# A PROJECTION over INSTITUTION_MEMBERSHIP / ENROLLMENT — no stored entity (R0.2 decision).
# Carries data, not display text: the client composes "Ученик · 9А" via i18n.
type LearningProfile {
  id: ID!                     # stable synthetic key "<kind>:<uuid>"
  kind: LearningProfileKind!
  institutionId: ID
  institutionName: String
  groupName: String           # the class, e.g. "9А"
  courseId: ID
  courseTitle: String
  courseCount: Int!           # subjects studied in this context
  isActive: Boolean!
}

# ----------------------------------------------------------------------------- Start page (atlas 00)
# The first window after sign-in. One frame for every role; the ACTIVE learning profile
# decides what fills it, so switching education re-scopes the whole page.
# Rows carry DATA (domain titles, times, counts) — never UI copy: the client words each row
# from `kind` through i18n.
type StartEntry {
  id: ID!
  kind: StartEntryKind!
  title: String!              # lesson / homework title (user content, not UI copy)
  courseTitle: String
  teacherName: String
  at: DateTime                # start time, deadline or grading time
  count: Int                  # queue size, or the score on a graded row
  ageDays: Int                # days until a deadline / since the oldest queued work
  sessionId: ID
  lessonId: ID
  courseId: ID
  isLive: Boolean!
}

type StartDay {
  date: Date!
  isToday: Boolean!
  entries: [StartEntry!]!
}

type StartProgress {
  courseId: ID!
  courseTitle: String!
  doneLessons: Int!
  totalLessons: Int!
  progressPct: Int!
}

# Курс преподавателя — «что я веду» (находка владельца 2026-08-15, п.2). Наполняет тот же
# слот, что `progress` у ученика: у преподавателя своего прогресса нет, и слот стоял пустым.
type StartCourse {
  courseId: ID!
  title: String!
  subject: String!
  sectionCount: Int!
  lessonCount: Int!
  publishedLessons: Int!
  studentCount: Int!
  isDraft: Boolean!
  nextAt: DateTime            # ближайшее занятие по курсу, если оно назначено
  nextLessonTitle: String
}

type StartPage {
  profile: LearningProfile
  now: StartEntry              # running lesson, else next today, else what to carry on with
  today: [StartEntry!]!
  attention: [StartEntry!]!
  week: [StartDay!]!           # seven days from today
  continueEntries: [StartEntry!]!
  progress: [StartProgress!]!
  teaching: [StartCourse!]!    # роль teacher; у остальных пусто
  # 🔴 §27.5 п.3: «Усвоение группы» листа 00. На его месте стояли «Мои курсы» — другая вещь:
  # преподаватель видел, ЧТО ведёт, и не видел, КАК это усвоено.
  mastery: [StartMastery!]!
}

# Одна тема и то, как она зашла классу. `answers` едет вместе с процентом намеренно: «84%»
# по четырём ответам и «84%» по двумстам — разные утверждения.
# Считается по объективным ответам (Attempt.is_correct), а НЕ по оценкам: у Submission.score
# в этой базе нет максимума, и процент из него был бы выведен из непроверяемой договорённости.
type StartMastery {
  lessonId: ID!
  title: String!
  courseTitle: String!
  masteryPct: Int!
  answers: Int!
  struggling: Int!
}

# ----------------------------------------------------------------------------- Надзор (atlas D7)
# Панель суперадмина: пока — очередь верификации преподавателей и журнал доступа.
# Решение владельца 2026-08-15 (OWNER_SCOPE §23): доступ полный, и КАЖДЫЙ просмотр чужого
# личного пишется в журнал. Журнал не редактируется и не удаляется — мутаций для этого нет и
# не будет. Учёт людей и блокировки — следующая фаза, эти же типы расширяются.
type VerificationQueueDocument {
  id: ID!
  filename: String!
  sizeBytes: Int
  createdAt: DateTime!
}

type VerificationQueueEntry {
  teacherUserId: ID!
  fullName: String!            # Фамилия Имя Отчество — очередь это карточка, а не обращение
  email: String!
  specialty: String!
  education: String!
  submittedAt: DateTime!
  courseCount: Int!        # нагрузка: решение о допуске к детям — по человеку, не по файлу
  sessionCount: Int!
  documents: [VerificationQueueDocument!]!
}

type AccessLogRow {
  id: ID!
  action: String!
  actorName: String!
  subjectName: String!
  objectLabel: String!
  reason: String!
  at: DateTime!
}

# Состояние учётной записи — три положения, не флажок (лист D7, OWNER_SCOPE §23.3.3).
# ACTIVE — обычная работа; LIMITED — входит и видит своё, но не ведёт занятий и не пишет в
# общие чаты; BLOCKED — входа нет. Ни одно состояние не трогает учёбу ученика (§20.5).
enum AccountStateValue { ACTIVE LIMITED BLOCKED }

# Один ПЕРЕХОД, а не текущее значение: на вопрос «почему у меня нет доступа» ответом может
# быть только запись с датой, автором и причиной.
type AccountStateRow {
  state: AccountStateValue!
  reason: String!
  actorName: String!
  at: DateTime!
}

# Человек в разделе «Люди». Ровно то, по чему принимают решение: кто, какая роль, состояние.
type PersonRow {
  userId: ID!
  fullName: String!
  email: String!
  role: String!
  state: AccountStateValue!
}

# ----------------------------------------------------------------------------- Subject cabinet (atlas 01)
# One frame for pupil, cadet and teacher. Rows carry DATA — "6 из 8 пройдено" and the lesson
# chips are worded client-side through i18n.
# Materials are split on purpose: `materials` is what the teacher and the programme gave,
# `savedMaterials` is what the learner kept. The sheet calls the separation principled.
type SubjectLesson {
  id: ID!
  title: String!
  subtitle: String
  progress: LessonProgress!
  kind: LessonKind!
  deviceKey: String
  orderLabel: String!
  materialCount: Int!
  hasHomework: Boolean!
  sessionId: ID
  sessionAt: DateTime
  isLive: Boolean!
  grade: Int
  completedBy: Int
  groupSize: Int
}

type SubjectSection {
  id: ID!
  title: String!
  doneLessons: Int!
  totalLessons: Int!
  lessons: [SubjectLesson!]!
}

type SubjectMaterial {
  id: ID!
  title: String!
  subtitle: String
  type: MaterialType
  url: String
  fromLabel: String
  lessonId: ID
  savedId: ID
  note: String
  savedKind: SavedItemKind
}

type SubjectSource {
  id: ID!
  name: String!
  sourceName: String
  url: String
  note: String
  inLesson: Boolean!
  savedId: ID
}

type SubjectCabinet {
  courseId: ID!
  title: String!
  profileKind: LearningProfileKind!
  institutionName: String
  groupName: String
  teacherName: String
  teacherId: ID
  lessonCount: Int!
  studentCount: Int
  progressPct: Int!
  gradingScale: GradingScale!
  sections: [SubjectSection!]!
  materials: [SubjectMaterial!]!
  savedMaterials: [SubjectMaterial!]!
  sources: [SubjectSource!]!
  nextLesson: SubjectLesson
}

# Atlas 01, «Задания» (teacher: «На проверке»). The learner fields carry the LATEST graded
# attempt — a retake replaces the mark shown — while `attempts` says how many there were:
# no attempt is ever overwritten (owner decision, sheet 01 answer 2). The teacher fields are
# counts only; no pupil is named.
type SubjectTask {
  id: ID!
  title: String!
  lessonId: ID
  lessonLabel: String
  dueAt: DateTime
  state: TaskState!
  submittedAt: DateTime
  score: Int
  comment: String
  attempts: Int!
  redoOpen: Boolean!
  submittedBy: Int
  groupSize: Int
  gradedCount: Int
  waitingCount: Int
  staleCount: Int
  retakeCount: Int
}

# One topic (a section) and how it was taken. `pct` is null when nothing is graded yet — a
# blank, not a zero.
type SubjectTopic {
  id: ID!
  title: String!
  lessonFrom: String
  lessonTo: String
  isCurrent: Boolean!
  pct: Int
  previousPct: Int
  weakCount: Int
  learnerCount: Int
}

# Mastery per topic, never one blended percentage. A learner is compared only with their own
# past (previousPct / previousOverallPct); a teacher sees the group's mastery and a COUNT of
# who is struggling — sheet 01 rules out efficiency profiles of individual children.
type SubjectProgress {
  profileKind: LearningProfileKind!
  topics: [SubjectTopic!]!
  overallPct: Int
  previousOverallPct: Int
  weakBelowPct: Int!
}

input SaveItemInput {
  courseId: ID = null
  lessonId: ID = null
  materialId: ID = null
  title: String = null
  url: String = null
  sourceName: String = null
  note: String = null
  kind: SavedItemKind = null
}

# =============================================================================
# Query
# =============================================================================
type Query {
  """Журнал предмета — первая половина (промпт 36 §5): занятия, присутствие, оценки по группе.
  Чего ещё нет: правка оценки в клетке, выгрузка, свод по четверти, переход из клетки в работу."""
  courseJournal(courseId: ID!): CourseJournal!
  # identity
  me: User
  learningProfiles: [LearningProfile!]!                    # caller's own educations
  startPage: StartPage!                                   # atlas 00, for the active education
  # Соседняя неделя для стрелок «‹ ›» полосы (лист 00, §27.5 п.2). Отдельный запрос, а не
  # аргумент стартовой: перелистнуть неделю — не повод пересобрать восемь работающих слотов.
  weekStrip(weekStart: Date!): [StartDay!]!
  subjectCabinet(courseId: ID!): SubjectCabinet!          # atlas 01 (access via can_access_course)
  mySavedItems(courseId: ID): [SubjectMaterial!]!         # caller's own saved items
  subjectTasks(courseId: ID!): [SubjectTask!]!            # atlas 01 «Задания»
  subjectProgress(courseId: ID!): SubjectProgress!        # atlas 01 «Прогресс»

  # files — правила загрузки, чтобы экран назвал потолок и типы ДО выбора файла
  uploadPolicy(purpose: UploadPurpose!): UploadPolicy!

  # надзор (D7) — только сотруднику платформы; каждый вызов пишет строку журнала
  verificationQueue: [VerificationQueueEntry!]!
  verificationDocumentUrl(id: ID!): String!
  oversightLog(limit: Int = 100): [AccessLogRow!]!
  # Раздел «Люди» листа D7. Поиск по имени и почте: панель открывают по конкретному разбору,
  # а не чтобы листать базу.
  oversightPeople(query: String = "", limit: Int = 50): [PersonRow!]!
  accountStateHistory(userId: ID!): [AccountStateRow!]!

  # chat (R2) — all scoped to the caller's own membership; none takes a user id
  myChannels: [ChatChannel!]!
  chatUnread: Int!                                        # the badge in the header
  channelMessages(channelId: ID!, limit: Int = 100): [ChannelMessage!]!
  chatPolicy: ChatPolicyView!
  chatReports: [ChatReport!]!                             # complaints the caller may act on

  # board (R3.2) — behind the lesson's own access rule
  board(lessonId: ID!): Board!
  boardSnapshots(lessonId: ID!): [BoardSnapshot!]!
  courseBoards(courseId: ID!): [BoardSnapshot!]!          # «доска прошлого урока»

  # exercises (R4.1)
  lessonExerciseSets(lessonId: ID!): [ExerciseSet!]!
  myAttempts(setId: ID!): [Attempt!]!                     # the caller's own; takes no user id
  setProgress(setId: ID!): SetProgress!
  exerciseLivePicture(setId: ID!): [ExerciseLiveRow!]!    # teacher only, aggregate only
  mySkillMastery(masteredOnly: Boolean = false): [SkillMastery!]!

  # dictionary (R4.3) — the language, not course content: a definition behind an enrolment
  # would be theatre, since the same word is a click away on any open dictionary in the world.
  lookupWord(lemma: String!): [LexicalItem!]!            # every sense — the card stacks them
  lessonWords(lessonId: ID!): [LexicalItem!]!            # «слова этого урока», lesson-gated
  myWords: [SrsCard!]!                                   # the caller's own; takes no user id
  externalDictionaries: [ExternalDictionary!]!           # closed bases, as outbound LINKS

  # repetition (R4.4) — 🔴 every one of these is the CALLER's own and takes no student id.
  # A «top learners» screen would need new fields here, which is exactly the point.
  myRepetitionQueue(limit: Int = 20): [DueCard!]!
  myRepetitionProgress: RepetitionProgress!
  myAchievements: [Achievement!]!

  # devices (Р5.0) — the caller's own machines, with a revoke button next to each
  myDevices: [Device!]!
  # Эта машина — о себе, по ключу машины (Authorization: Device). Аргументов не принимает:
  # спросить о ЧУЖОЙ машине через эту дверь невозможно by construction. Без неё мастер первого
  # запуска не мог вернуться на пройденный шаг — состояние он брал из myDevices, а тот требует
  # пользовательской сессии, которой в приложении нет (§19.4).
  thisDevice: Device!
  # Только преподаватель группы: кто из детей когда заходил — не общее знание.
  meetingParticipants(groupId: ID!): [MeetingParticipant!]!

  # meeting point (Р5.0) — all three answer WITHOUT the teacher's machine being awake
  meetingPoint(slug: String!): MeetingPointView!
  meetingPointByCode(code: String!): MeetingPointView!
  groupMeetingPoint(groupId: ID!): MeetingPoint!         # teacher of the group only

  # the pupil's mirror (Р5.0-Б) — 🔒 the caller's OWN, always. Takes no student id, and
  # somebody else's mirror is not reachable by asking nicely.
  myMirror(kind: MirrorKind, limit: Int = 100): [MirroredRecord!]!
  # Opens a file the pupil attached to their OWN work. Authorised against the mirror and not
  # the submission — the submission may be gone with the teacher's account, and that is
  # exactly when this has to work. The key must be one the record actually carries.
  mirroredFileUrl(recordId: ID!, objectKey: String!): String!

  # signalling and the channel measurement (Р5.1)
  turnCredentials: TurnCredentials!                      # expires within the hour, per person
  uplinkProbe: UplinkProbe!                              # 12 s, and the thresholds to judge by

  # summary (R4.2) — the teacher gets the draft; everyone else gets it only once it is sent,
  # and gets NULL rather than a refusal until then (whether it is being written is not their
  # business either). lessonChat is the exception: participants read the CHAT section live.
  lessonSummary(sessionId: ID!): LessonSummary
  lessonChat(sessionId: ID!): [ChatMessage!]!

  # catalog & content
  catalog(filter: CourseFilter, first: Int = 20, after: String): CourseConnection!
  course(id: ID!): Course
  lesson(id: ID!): Lesson
  myCourses: [Course!]!                                   # teacher's own courses (incl. drafts)
  session(id: ID!): LessonSession
  teacher(id: ID!): TeacherProfile           # public teacher card
  teacherReviews(teacherId: ID!): [Review!]!

  # schedule (role-aware: own lessons / children / institution)
  mySchedule(from: DateTime!, to: DateTime!): [LessonSession!]!

  # dashboards (composite, auth + role)
  studentDashboard: StudentDashboard!
  teacherDashboard: TeacherDashboard!
  adminDashboard: AdminDashboard!
  parentChildren: [StudentProfile!]!
  parentChildOverview(childId: ID!): ParentChildOverview!

  # homework / grading
  homework(id: ID!): Homework
  myHomework: [Homework!]!                                # student: every published homework on their courses
  lessonHomework(lessonId: ID!): [Homework!]!             # published for students, all for the owning teacher
  homeworkSubmissions(homeworkId: ID!): [Submission!]!     # teacher grading list
  mySubmissions(courseId: ID): [Submission!]!              # student

  # SEduM analytics
  attentionAnalytics(studentId: ID, courseId: ID, from: DateTime, to: DateTime): AttentionAnalytics!
  sessionAttention(sessionId: ID!): AttentionSummary!      # post-session report
  groupAnalytics(groupId: ID!): GroupAnalytics!            # teacher / admin
  recommendations: [Recommendation!]!
  ubpBackup: UbpBackup                                     # for device restore

  # engagement — see the Engagement block: no leaderboard, by owner decision 2026-08-13.
  # myAchievements lives with the repetition reads above; it is the same list.

  # institution / admin
  institution(id: ID!): Institution
  groups(institutionId: ID!): [Group!]!
  group(id: ID!): Group
  institutionMembers(institutionId: ID!, role: MembershipRole): [InstitutionMembership!]!

  # certificates
  certificate(id: ID!): Certificate
  """⚠️ НЕ ПОСТРОЕНО (проверено 18.08, промпт 35-36). Ни резолвера, ни приложения
  `certificates`, ни экрана `/verify` — маршрута в роутере нет ни одного, и всё, что туда
  приходит, ловит `path="*"`. Два теста на этот адрес годами проходили, потому что смотрели
  на страницу переадресации; строка убрана из списка маршрутов до появления экрана.
  Обещание в силе (MVP заменяет NFT-сертификаты на PDF + QR) — это форвард-контракт."""
  verifyCertificate(verificationId: ID!): CertificateVerification!   # PUBLIC, НЕ ПОСТРОЕНО

  # notifications
  notifications(first: Int = 20, after: String, unreadOnly: Boolean = false): NotificationConnection!
  notificationPreferences: [NotificationPreference!]!
}

# =============================================================================
# Mutation
# =============================================================================
type Mutation {
  # --- auth & onboarding
  registerUser(input: RegisterUserInput!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
  refreshToken(refreshToken: String!): AuthPayload!
  logout: Boolean!
  """Пояс человека (§37 — «все по Москве» отменено). Показ считает браузер, а ГРАНИЦЫ СУТОК
  («сегодня», серия занятий, «требует внимания») считает сервер, и ему нужен ответ без
  открытого браузера. Экран зовёт молча при входе."""
  setMyTimezone(timezoneName: String!): Boolean!
  """`true` — мы умеем отправить письмо; `false` — восстановление недоступно, и экран говорит
  об этом словами. Про существование учётной записи ответ по-прежнему молчит."""
  requestPasswordReset(email: String!): Boolean!
  resetPassword(token: String!, newPassword: String!): Boolean!
  verifyEmail(token: String!): Boolean!
  setActiveLearningProfile(id: ID!): LearningProfile!     # switch education (own only)
  saveItem(input: SaveItemInput!): SubjectMaterial!       # keep a link, never a copy
  removeSavedItem(id: ID!): Boolean!
  addChild(input: AddChildInput!): Guardianship!            # parent links/creates a child
  respondGuardianship(id: ID!, accept: Boolean!): Guardianship!   # child confirms request
  submitVerificationDocument(fileKey: String!): VerificationDocument!   # teacher
  # Решение по преподавателю — надзор (лист D7). Отказ обязан нести причину: она уходит
  # человеку текстом, а не молчанием.
  verifyTeacher(teacherUserId: ID!): User!
  rejectTeacher(teacherUserId: ID!, reason: String!): User!
  requestVerificationDocuments(teacherUserId: ID!, reason: String!): User!
  # Перевести учётную запись в состояние. Причина обязательна для всего, кроме возврата в
  # ACTIVE: закрыть человеку доступ молча — то же, что отказать в верификации без причины.
  setAccountState(userId: ID!, state: AccountStateValue!, reason: String = ""): User!
  setAvatar(fileKey: String!): User!                                    # own avatar (student/teacher)
  # Своё имя. Отчество появилось после того, как люди уже зарегистрировались (§24) — без этой
  # мутации добавить его было бы негде.
  updateMyName(firstName: String!, lastName: String!, middleName: String = ""): User!

  # --- files
  requestUpload(input: UploadRequestInput!): UploadTicket!

  # --- courses / lessons (teacher)
  createCourse(input: CourseInput!): Course!
  updateCourse(id: ID!, input: CourseInput!): Course!
  publishCourse(id: ID!): Course!
  unpublishCourse(id: ID!): Course!
  archiveCourse(id: ID!): Course!
  deleteCourse(id: ID!): Boolean!
  createSection(courseId: ID!, input: SectionInput!): Section!
  updateSection(id: ID!, input: SectionInput!): Section!
  reorderSections(courseId: ID!, orderedIds: [ID!]!): [Section!]!
  deleteSection(id: ID!): Boolean!
  createLesson(sectionId: ID!, input: LessonInput!): Lesson!
  updateLesson(id: ID!, input: LessonInput!): Lesson!
  reorderLessons(sectionId: ID!, orderedIds: [ID!]!): [Lesson!]!
  publishLesson(id: ID!): Lesson!
  deleteLesson(id: ID!): Boolean!
  addMaterial(input: MaterialInput!): Material!
  deleteMaterial(id: ID!): Boolean!

  # --- scheduling & live sessions
  scheduleSession(input: ScheduleSessionInput!): LessonSession!
  startSession(sessionId: ID!): LessonSession!              # teacher -> LIVE (+roomToken)
  endSession(sessionId: ID!): LessonSession!                # -> ENDED (no recording: §2.2)
  joinSession(sessionId: ID!): SessionJoin!                 # student -> roomToken + ATTENDANCE

  # second screen (R3.1) — cast, not a second login
  createProjectorCode(sessionId: ID!): ProjectorCast!       # teacher of the session only
  redeemProjectorCode(code: String!): ProjectorJoin!        # UNAUTHENTICATED by design
  setProjectorFocus(sessionId: ID!, studentId: ID): ProjectorFocus!
  setAttendance(sessionId: ID!, studentId: ID!, status: AttendanceStatus!): Attendance!
  sendChatMessage(sessionId: ID!, text: String!): ChatMessage!

  # chat (R2)
  openSubjectChannel(courseId: ID!): ChatChannel!
  openDirectChannel(userId: ID!): ChatChannel!            # only people from your own groups
  openStaffChannel(institutionId: ID!): ChatChannel!
  sendChannelMessage(channelId: ID!, text: String!): ChannelMessage!
  markChannelRead(channelId: ID!): Boolean!
  reportChannel(channelId: ID!, reason: String, messageId: ID): ChatReport!
  resolveChatReport(reportId: ID!, dismiss: Boolean = false): ChatReport!

  # board (R3.2)
  putBoardElement(lessonId: ID!, input: BoardElementInput!): BoardElement!
  removeBoardElement(lessonId: ID!, elementId: ID!): Boolean!
  setBoardOpen(lessonId: ID!, isOpen: Boolean!): Boolean!  # teacher only
  saveBoard(lessonId: ID!, title: String): BoardSnapshot!  # -> lesson materials

  # exercises (R4.1)
  answerExercise(
    exerciseId: ID!, response: JSON!, context: AttemptContext = PRACTICE,
    sessionId: ID, latencyMs: Int = 0, hintsUsed: Int = 0
  ): Attempt!
  handInExerciseSet(setId: ID!): HomeworkHandIn!
  countLiveAsClasswork(setId: ID!, studentId: ID!): ID!   # a live lesson grades only on purpose

  # dictionary (R4.3) — the three actions on the card, each reusing a rule we already have
  addWordToMyList(itemId: ID!, direction: CardDirection = RECOGNITION): SrsCard!  # idempotent
  putWordOnBoard(lessonId: ID!, itemId: ID!): ID!         # through the board's own write rule
  showWordToClass(sessionId: ID!, itemId: ID!): WordShown! # teacher only; stores nothing

  # repetition (R4.4) — the client scheduled it with ts-fsrs; this records it. reps/lapses
  # are counted server-side: a history a client can rewrite is not a history.
  reviewWord(
    cardId: ID!, rating: ReviewRating!,
    stability: Float!, difficulty: Float!, dueAt: DateTime!, state: CardState!,
    learningSteps: Int = 0
  ): DueCard!

  # pairing a machine (Р5.0) — 🔒 not one of these takes a password, and none ever will
  # (PROMPT_14 §2.2.1). The fallback «войти по почте и паролю» is the ordinary web login.
  requestPairingCode(                                     # UNAUTHENTICATED: the app has no
    deviceName: String!, platform: DevicePlatform = OTHER, # identity yet, and giving it one
    appVersion: String = ""                                # would have meant asking for a password
  ): PairingRequest!
  confirmPairingCode(code: String!): Device!              # in the BROWSER, signed in — the one
                                                          # place identity enters the flow
  claimDeviceToken(code: String!, secret: String!): DeviceClaim!  # once; secret proves the asker
  revokeDevice(deviceId: ID!): Boolean!                   # the stolen-laptop button; kills its keys too

  # meeting point (Р5.0)
  setMeetingAccess(groupId: ID!, mode: MeetingAccessMode!): MeetingPoint!
  replaceMeetingLink(groupId: ID!): MeetingPoint!         # the old slug is remembered, so it can
                                                          # say «заменена» instead of «не найдено»
  # Both of these are the MACHINE talking, authenticated by `Authorization: Device <key>`
  # (Р5.2). They used to take the key as an argument — that put a live credential into every
  # query log that records variables, and it is now one path for everything.
  hostHeartbeat: HostPresence!                            # the machine says it is alive
  # 🔴 Recording a measurement refuses nothing (§19.3): the teacher is told what the channel
  # is good for and decides — they know what the lesson is and who the children are.
  reportUplink(mbps: Float!, connectionType: ConnectionType = UNKNOWN): Device!
  # --- first run (лист D2, Р5.4). All four authenticate as the MACHINE, via
  # `Authorization: Device <key>`: the five steps are this machine's progress through its own
  # setup, so the machine is who reports them.
  advanceDeviceSetup(step: Int!): Device!                 # monotonic — re-reading step 3 does
                                                          # not forget step 4
  configureCabinetBackup(                                 # 🔴 §19.1 — обязательна; NONE is
    kind: BackupKind!                                     # refused, and so is finishing without
    cloudCopy: Boolean = false                            # having configured one
  ): Device!
  recordCabinetBackup: Device!                            # «сделать сейчас» отработало
  completeDeviceSetup: Device!                            # «готово»; refuses without the copy
  # Р5.5 — writer of the copy §19.1 makes mandatory. Один файл: строки CABINET_TABLES плюс
  # байты, на которые они ссылаются. `passphrase` необязателен для копии на свой диск и
  # обязателен для той, что уходит к нам.
  exportCabinet(passphrase: String): CabinetBackup!

  # signalling (Р5.1) — routes one handshake message and writes nothing down
  sendSignal(sessionId: ID!, toPeer: ID!, kind: SignalKind!, payload: String!): Boolean!

  # summary (R4.2) — teacher-only, all of them; sendChatMessage above is everyone's
  assembleLessonSummary(sessionId: ID!): LessonSummary!   # «собрать саммари сейчас»
  addSummaryItem(
    sessionId: ID!, section: SummarySection!, text: String!, dueAt: DateTime
  ): SummaryItem!
  updateSummaryItem(itemId: ID!, text: String!): SummaryItem!
  removeSummaryItem(itemId: ID!): Boolean!
  setSummaryIntro(sessionId: ID!, text: String!): LessonSummary!
  sendLessonSummary(sessionId: ID!): LessonSummary!       # -> materials + «Задания»
  # PROMPT_13 §5: «речь занятий обрабатывается для саммари; видео и аудио не записываются».
  # Withheld by default — a default-on consent is not a consent.
  setSpeechConsent(granted: Boolean!): Boolean!
  # D2 step 3 (Р5.4). Off is where every account starts, and the server keeps it that way:
  # `recordAttention` drops the bucket without this. Not a UI default — a server one.
  setAttentionConsent(granted: Boolean!): Boolean!
  reportAttention(input: AttentionInput!): Boolean!         # client pushes aggregate only

  # --- enrollment & progress
  enroll(courseId: ID!): Enrollment!
  unenroll(courseId: ID!): Boolean!
  markLessonViewed(lessonId: ID!): Enrollment!

  # --- homework / grading
  createHomework(input: HomeworkInput!): Homework!
  updateHomework(id: ID!, input: HomeworkInput!): Homework!
  publishHomework(id: ID!): Homework!
  deleteHomework(id: ID!): Boolean!
  submitHomework(input: SubmitHomeworkInput!): Submission!
  gradeSubmission(input: GradeInput!): Submission!

  # --- certificates
  issueCertificate(courseId: ID!): Certificate!            # after completion / passing

  # --- institution / admin
  createInstitution(input: InstitutionInput!): Institution!
  updateInstitution(id: ID!, input: InstitutionInput!): Institution!
  updateBranding(institutionId: ID!, branding: JSON!): Institution!
  inviteMember(input: InviteInput!): InstitutionMembership!
  updateMembership(id: ID!, role: MembershipRole, status: MembershipStatus): InstitutionMembership!
  removeMember(id: ID!): Boolean!
  createGroup(input: GroupInput!): Group!
  updateGroup(id: ID!, input: GroupInput!): Group!
  addStudentsToGroup(groupId: ID!, studentIds: [ID!]!): Group!
  removeStudentFromGroup(groupId: ID!, studentId: ID!): Group!
  assignTeacher(groupId: ID!, teacherId: ID!, subject: String!): GroupTeacher!

  # --- engagement
  createReview(teacherId: ID!, rating: Int!, text: String): Review!
  moderateReview(id: ID!, status: ReviewStatus!): Review!  # admin
  dismissRecommendation(id: ID!): Recommendation!

  # --- SEduM / UBP (opt-in, encrypted)
  backupUbp(input: UbpBackupInput!): UbpBackup!
  deleteUbpBackup: Boolean!

  # --- notifications
  markNotificationRead(id: ID!): Notification!
  markAllNotificationsRead: Boolean!
  updateNotificationPreference(input: NotificationPreferenceInput!): NotificationPreference!
}

# =============================================================================
# Subscription  (WebSocket — graphql-ws)
# =============================================================================
type Subscription {
  # teacher watches the class attention live; payload is an aggregate, never video
  attentionUpdates(sessionId: ID!): AttentionMetric!
  # second screen follows the teacher's focus (F3.1) — payload is one participant id
  projectorFocusChanged(sessionId: ID!): ProjectorFocus!
  # the live canvas — optimistic, no locks
  boardChanged(lessonId: ID!): BoardChange!
  # session lifecycle (scheduled -> live -> ended)
  """Занятие началось или закончилось. Резолвер и публикация появились 18.08 (промпт 35 §4);
  до того это была строка контракта без кода — класс не узнавал о конце урока ниоткуда."""
  sessionStatusChanged(sessionId: ID!): LessonSession!
  # live lesson chat
  chatMessageReceived(sessionId: ID!): ChatMessage!
  # «показать всем» (R4.3) — the teacher points at a word; each client turns to the card it
  # can already read for itself. An id travels, nothing is stored.
  wordShown(sessionId: ID!): WordShown!
  # Р5.0 — the «преподаватель не в сети» screen, told the moment it stops being true. This is
  # also what auto-opens the room: the pupil does not refresh, the page notices.
  hostPresenceChanged(slug: String!): HostPresence!
  # Р5.1 — each participant listens on a channel of their own, so a handshake reaches the one
  # person it is addressed to. Broadcasting to the room would hand every pupil's home IP
  # address to every other pupil.
  signals(sessionId: ID!): Signal!
  # standing chat (R2) — the socket re-checks membership before streaming anything
  channelMessageReceived(channelId: ID!): ChannelMessage!
  # current user's notifications (new grade, absence, CMF insight, ...)
  notificationReceived: Notification!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
