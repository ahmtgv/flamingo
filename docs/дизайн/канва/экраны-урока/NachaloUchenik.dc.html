<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <style>
    :root{
      --fl-white:#ffffff; --fl-warm-100:#f1f1ef; --fl-warm-150:#e9e9e6; --fl-warm-200:#d9d9d6;
      --fl-warm-300:#c4c4c1; --fl-warm-900:#1d1d1f; --fl-coral-500:#e14e1f; --fl-coral-700:#a83610;
      --fl-moss-500:#2f8a56; --fl-moss-700:#226741; --fl-moss-300:#7fd3a3; --fl-moss-50:#e7f2ea;
      --fl-info-500:#2f6fa8; --fl-dark-bg:#101012;
      --color-bg:#f1f1ef; --color-surface:#ffffff; --color-surface-subtle:#e9e9e6;
      --color-surface-hover:#e9e9e6; --color-border:#d9d9d6; --color-border-strong:#c4c4c1;
      --color-text:#1d1d1f; --color-text-secondary:#646469; --color-text-hint:#6b6b75; --color-text-disabled:#a8a8ad;
      --color-text-detail:#646469; --color-accent:#e14e1f; --color-accent-text:#a83610;
      --color-accent-solid:#c23f14; --color-on-accent:#ffffff;
      --color-go:#2f8a56; --color-go-text:#226741; --color-go-solid:#226741; --color-go-bg:#e7f2ea;
      --color-go-border:#7fd3a3; --color-on-go:#ffffff;
      --color-surface-video:#101012; --color-text-on-video:#f2f2f0;
      --color-text-on-video-quiet:rgba(255,255,255,.72); --color-border-on-video:rgba(255,255,255,.22);
      --color-surface-on-video:rgba(255,255,255,.12); --color-go-on-video:#7fd3a3;
      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
      --space-6:24px; --space-7:32px; --space-8:40px;
      --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-card:14px; --radius-pill:999px;
      --text-h3:1.1875rem; --text-body:1.0625rem; --text-small:.875rem; --text-caption:.8125rem;
      --font-heading:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;
      --font-body:-apple-system,'SF Pro Text','Inter',system-ui,sans-serif;
      --font-mono:'JetBrains Mono','SF Mono','IBM Plex Mono',ui-monospace,monospace;
      --weight-regular:400; --weight-medium:500; --weight-semibold:600;
      --leading-snug:1.4; --tracking-snug:-.01em;
      --control-height-sm:34px; --control-height-md:42px;
      --shadow-sm:0 1px 2px rgba(0,0,0,.03),0 2px 6px rgba(0,0,0,.04);
      --shadow-md:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05);
      --tile-min-height:112px;
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font-body);color:var(--color-text);background:var(--color-bg)}
    a{color:var(--color-accent-text)} a:hover{color:var(--color-accent)}
  </style>
</helmet>

        <circle cx="77" cy="8" r="2.2" fill="#fff"></circle>

        font:500 .8125rem var(--font-mono);color:var(--color-text-detail)">

            color:var(--color-text-on-video-quiet);max-width:calc(100% - 16px);overflow:hidden;

      overflow:hidden;background:var(--color-surface-on-video);border:1px solid var(--color-border-on-video);display:grid;place-items:center">
      <span style="font:500 1.1875rem var(--font-mono);color:var(--color-text-on-video-quiet);letter-spacing:.04em">СП</span>

  <footer style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;
