# «Мои материалы» — решение владельца §27.2. Личная папка ученика: что он сохранил из уроков
# и из хаба, с его заметками. Хранится ССЫЛКА, а не копия: лицензия едет с источником.
query MySavedItems {
  mySavedItems {
    id
    title
    url
    fromLabel
    note
    savedId
    savedKind
    lessonId
  }
}
