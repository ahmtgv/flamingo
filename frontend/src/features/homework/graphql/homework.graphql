# Homework operations. Fragment-free and selecting only backend-implemented live
# fields (see the SDL-vs-live drift note). Homework/Submission names match the SDL.

query LessonHomework($lessonId: ID!) {
  lessonHomework(lessonId: $lessonId) {
    id
    title
    description
    type
    dueAt
    allowRedo
    publishedAt
    submissionStats {
      total
      submitted
      graded
      late
    }
    viewerSubmission {
      id
      status
      score
      markless
      comment
      attempt
    }
  }
}

query HomeworkSubmissions($homeworkId: ID!) {
  homeworkSubmissions(homeworkId: $homeworkId) {
    id
    attempt
    status
    score
    markless
    comment
    contentText
    submittedAt
    student {
      user {
        id
        firstName
        lastName
        formalName
        shortName
        displayName
        shortName
        formalName
      }
    }
  }
}

query MySubmissions($courseId: ID) {
  mySubmissions(courseId: $courseId) {
    id
    status
    score
    markless
    comment
    attempt
    submittedAt
    homework {
      id
      title
    }
  }
}

mutation CreateHomework($input: HomeworkInput!) {
  createHomework(input: $input) {
    id
    title
    publishedAt
  }
}

mutation PublishHomework($id: ID!) {
  publishHomework(id: $id) {
    id
    publishedAt
  }
}

mutation DeleteHomework($id: ID!) {
  deleteHomework(id: $id)
}

mutation SubmitHomework($input: SubmitHomeworkInput!) {
  submitHomework(input: $input) {
    id
    status
    attempt
  }
}

mutation GradeSubmission($input: GradeInput!) {
  gradeSubmission(input: $input) {
    id
    status
    score
    markless
    comment
  }
}

# Журнал предмета — первая половина (наряд 36 §5). Кнопка «Открыть журнал» с листа 01 вела в
# очередь проверки СТАРОЙ рамы: новый экран и архивный кабинет были склеены переходом.
query CourseJournal($courseId: ID!) {
  courseJournal(courseId: $courseId) {
    courseId
    title
    students {
      studentId
      name
      markless
    }
    sessions {
      sessionId
      title
      startAt
      status
    }
    cells {
      studentId
      sessionId
      attendance
      score
    }
  }
}
