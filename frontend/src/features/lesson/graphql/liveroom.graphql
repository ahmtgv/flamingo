# Live CMF room operations. Fragment-free; names match the live SDL (seedum types
# carry no *Type suffix). The student pushes ONLY the aggregate via reportAttention;
# the teacher watches the class live via attentionUpdates and pulls the post-session
# report via sessionAttention. No frame/landmark/video field exists anywhere.

mutation ReportAttention($input: AttentionInput!) {
  reportAttention(input: $input)
}

subscription AttentionUpdates($sessionId: ID!) {
  attentionUpdates(sessionId: $sessionId) {
    id
    sessionId
    studentId
    bucketStart
    avgAttention
    gazeOnScreen
    eyeOpenness
    headYaw
    headPitch
    alertness
  }
}

query SessionAttention($sessionId: ID!) {
  sessionAttention(sessionId: $sessionId) {
    averageAttention
    peak
    low
    points {
      at
      value
    }
  }
}

# Room entry: status + the per-viewer LiveKit token (resolved via room_token_for —
# non-null only for a participant of a LIVE session). The LiveKit server URL itself
# comes from VITE_LIVEKIT_URL, not the API.
query SessionRoom($id: ID!) {
  session(id: $id) {
    id
    status
    # Начало занятия — рама приложения показывает «Идёт 24:16» от него, а не от момента,
    # когда преподаватель нажал «Войти в эфир» (лист D1).
    startAt
    roomToken
    teacherName
    # Р5.1: the student's strip shows the teacher and their own preview — the client needs to
    # know WHICH remote that is. One id; the roster stays teacher-only.
    teacherId
    lesson {
      id
      title
    }
  }
}

# Teacher-only roster → maps studentId (= user.id, the same id attentionUpdates emits and
# the LiveKit participant identity) to a display name, so the live per-student cards and the
# video tiles show names instead of id-slices. The `attendance` field is owner-scoped
# server-side (returns [] for non-owners), so a non-teacher gets nothing here. Display-only —
# carries no attention/biometric data.
query SessionAttendees($id: ID!) {
  session(id: $id) {
    id
    attendance {
      student {
        user {
          id
          firstName
          lastName
          formalName
          shortName
          displayName
          shortName
          formalName
        }
      }
    }
  }
}
