# Auth domain operations.
#
# NOTE: deliberately fragment-free and selecting only fields the live backend
# implements, so these validate against docs/flamingo_schema.graphql (codegen)
# AND run against the real Strawberry API, despite the SDL<->live type-name drift
# (User vs UserType, ID vs UUID, DateTime vs Date). Inputs are passed as
# whole-object variables so scalar-name drift never appears in the document.

mutation Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    token
    refreshToken
    user {
      id
      email
      firstName
      lastName
      role
      locale
      studentProfile {
        ageBand
        gradeLevel
        points
      }
      teacherProfile {
        verificationStatus
      }
    }
  }
}

mutation RegisterUser($input: RegisterUserInput!) {
  registerUser(input: $input) {
    token
    refreshToken
    user {
      id
      email
      firstName
      lastName
      role
      locale
      studentProfile {
        ageBand
        gradeLevel
        points
      }
      teacherProfile {
        verificationStatus
      }
    }
  }
}

mutation RefreshToken($refreshToken: String!) {
  refreshToken(refreshToken: $refreshToken) {
    token
    refreshToken
    user {
      id
      email
      firstName
      lastName
      role
      locale
      studentProfile {
        ageBand
        gradeLevel
        points
      }
      teacherProfile {
        verificationStatus
      }
    }
  }
}

mutation RequestPasswordReset($email: String!) {
  requestPasswordReset(email: $email)
}

mutation ResetPassword($token: String!, $newPassword: String!) {
  resetPassword(token: $token, newPassword: $newPassword)
}

# Parent adds/links a child (consumed by the parent cabinet — wired here so the
# typed hook is ready). Carries 152-FZ consent at creation.
mutation AddChild($input: AddChildInput!) {
  addChild(input: $input) {
    id
    status
    consent152fz
    consentAt
    child {
      id
      firstName
      lastName
    }
  }
}

# Преподаватель отправляет документ на проверку. Путь замкнулся 15.08: очередь и решение
# живут в надзоре (лист D7), а до того мутация никуда не вела — экрана подтверждения не было.
mutation SubmitVerificationDocument($fileKey: String!) {
  submitVerificationDocument(fileKey: $fileKey) {
    id
    filename
    status
    createdAt
  }
}

query Me {
  me {
    id
    email
    firstName
    lastName
    role
    locale
    avatarUrl
    # D2 шаг 3 (Р5.4): мастер первого запуска и экран настроек читают согласия отсюда —
    # оба по умолчанию false, и анализ внимания остаётся выключенным, пока его не включат.
    consentSpeech
    consentAttention
    studentProfile {
      ageBand
      gradeLevel
      points
    }
    teacherProfile {
      verificationStatus
      specialty
      # Без документов «не загружал» неотличимо от «жду решения»: статус рождается PENDING,
      # и баннер «Документы на проверке» висел у каждого (находка владельца 15.08, п.4).
      verificationDocuments {
        id
        filename
        sizeBytes
        status
        reason
        createdAt
      }
    }
    parentProfile {
      children {
        ageBand
        gradeLevel
        user {
          id
          firstName
          lastName
        }
      }
    }
  }
}

# Own avatar. Returns id + avatarUrl so Apollo updates the normalized User in cache (the Me
# query reflects the new avatar without a refetch). The bytes were already PUT directly to S3.
mutation SetAvatar($fileKey: String!) {
  setAvatar(fileKey: $fileKey) {
    id
    avatarUrl
  }
}

# --- learning profiles (R0.2) -------------------------------------------------
# The educations inside one account (owner req. 15). Data only — the UI composes
# "Ученик · 9А" from `kind` + `groupName` via i18n, so no display text is fetched.

query LearningProfiles {
  learningProfiles {
    id
    kind
    institutionId
    institutionName
    groupName
    courseId
    courseTitle
    courseCount
    isActive
  }
}

mutation SetActiveLearningProfile($id: ID!) {
  setActiveLearningProfile(id: $id) {
    id
    kind
    isActive
  }
}
