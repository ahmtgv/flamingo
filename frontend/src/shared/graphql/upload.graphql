# Files module — presigned uploads. requestUpload returns a presigned PUT URL + the object
# key; the client PUTs bytes DIRECTLY to S3 (never through GraphQL) and submits the fileKey to
# the relevant mutation. Fragment-free; matches the committed SDL (no SDL change).
mutation RequestUpload($input: UploadRequestInput!) {
  requestUpload(input: $input) {
    uploadUrl
    fileKey
    expiresAt
  }
}

# Правила загрузки — числами и ДО попытки (находка владельца 15.08, п.3). Запрашиваются у
# сервера, а не хранятся константой в клиенте: константа разошлась бы с политикой молча.
query UploadPolicy($purpose: UploadPurpose!) {
  uploadPolicy(purpose: $purpose) {
    purpose
    maxBytes
    contentTypes
  }
}
