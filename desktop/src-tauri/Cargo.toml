[package]
name = "flamingo-desktop"
version = "0.1.0"
description = "Flamingo — урок идёт с машины преподавателя"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: свёрнутое окно не заканчивает урок — трей это то, во что оно сворачивается (D1).
tauri = { version = "2", features = ["tray-icon"] }
# 🔒 Ключ машины живёт только здесь: связка ключей ОС, не файл и не localStorage (§19.4).
#
# 🔴 `features = ["apple-native"]` — НЕ УКРАШЕНИЕ (промпт 21 §2.5). Без явной платформенной
# фичи keyring 3 собирается с ПОДДЕЛЬНЫМ хранилищем в памяти процесса: `set_password` отвечает
# `Ok(())`, `security find-generic-password` не находит ничего, а другой процесс читает
# `NoEntry`. Ключ машины не доживал до перезапуска — и обещание «ключ живёт в связке ключей ОС»
# было неправдой с самого начала.
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-dialog = "2.0.0-rc.8"
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-clipboard-manager = "2"

[profile.release]
# The shell is a window and a process supervisor; nothing here is hot. Optimise for the
# thing a person actually feels — the size of what they download.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
